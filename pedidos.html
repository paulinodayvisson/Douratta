
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acompanhar meu pedido — Douratta Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<style>
:root{
  --dourado:#F9B31A; --dourado-dark:#C6870A;
  --vermelho:#D31A1B; --verde:#2E8B45; --verde-pale:#E4F3E8;
  --avorio:#FFFBF2; --avorio-dark:#F1E7D2;
  --carvao:#211A0F; --carvao-soft:#3A2E18;
  --linha:rgba(33,26,15,0.10);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--avorio-dark);color:var(--carvao);min-height:100vh;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 22;font-size:20px;vertical-align:middle;}
button{font-family:inherit;border:none;cursor:pointer;}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px 50px;}
.top{text-align:center;margin-bottom:16px;}
.top h1{font-family:var(--font-display);font-size:1.3rem;font-weight:700;}
.top .sub{font-size:0.8rem;opacity:.6;margin-top:2px;}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(33,26,15,0.07);margin-bottom:16px;}
.card h2{font-family:var(--font-display);font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.linha{display:flex;justify-content:space-between;gap:10px;font-size:0.85rem;padding:6px 0;border-bottom:1px dashed var(--linha);}
.linha:last-child{border-bottom:none;}
.item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--linha);}
.item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.item .nome{font-weight:800;font-size:0.92rem;margin-bottom:3px;}
.item .det{font-size:0.78rem;opacity:.75;margin-top:2px;}
.item .preco{font-weight:700;color:var(--vermelho);font-size:0.85rem;margin-top:4px;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:2px solid var(--carvao);}
.total-row .valor{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--vermelho);}
.pix-card{text-align:center;}
.pix-card img{width:190px;height:190px;border-radius:12px;margin:6px auto 12px;display:block;}
.pix-chave{font-family:var(--font-mono);font-size:0.85rem;background:var(--avorio);border-radius:10px;padding:10px 12px;word-break:break-all;margin-bottom:10px;}
.btn-copiar{width:100%;background:var(--verde);color:#fff;padding:12px;border-radius:12px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.aviso{font-size:0.74rem;opacity:.6;margin-top:10px;line-height:1.4;}
.loading-note,.empty-note{text-align:center;padding:40px 16px;opacity:.6;font-size:0.88rem;}
.status-tag{display:inline-block;background:var(--dourado);color:var(--carvao);font-size:0.7rem;font-weight:800;padding:3px 10px;border-radius:99px;margin-bottom:10px;word-break:break-all;}

/* ---- linha do tempo de status (mesmas etapas e ícones do acompanhamento do cardápio) ---- */
.track-steps{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.track-step{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--avorio);opacity:.4;transition:opacity .3s;}
.track-step.done{opacity:1;}
.track-step.current{opacity:1;background:#fff;box-shadow:0 6px 20px rgba(211,26,27,0.18);animation:trackPulso 1.6s ease-in-out infinite;}
@keyframes trackPulso{0%,100%{box-shadow:0 6px 20px rgba(211,26,27,0.18);}50%{box-shadow:0 6px 26px rgba(211,26,27,0.38);}}
.track-step .ico{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--avorio-dark);color:var(--vermelho);}
.track-step.done .ico{background:var(--verde);color:#fff;}
.track-step.current .ico{background:var(--vermelho);color:#fff;}
.track-step .ico svg{width:16px;height:16px;}
.track-step.current .ico svg{animation:trackGirar 1.4s linear infinite;}
.track-step.current .ico[data-spin="0"] svg{animation:none;}
@keyframes trackGirar{to{transform:rotate(360deg);}}
.track-step .txt{font-weight:700;font-size:0.92rem;}
.btn-recebi{width:100%;margin-top:14px;background:var(--verde);color:#fff;padding:12px;border-radius:12px;font-weight:700;font-size:0.88rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-recebi:disabled{opacity:.6;cursor:default;}
.confirm-hint{font-size:0.78rem;opacity:.7;margin-top:14px;text-align:center;line-height:1.4;}
.confirm-hint + .btn-recebi{margin-top:8px;}
.thanks-box{text-align:center;padding:10px 4px 4px;}
.thanks-box .ico-big{width:68px;height:68px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.thanks-box .ico-big svg{width:34px;height:34px;}
.thanks-box h2{justify-content:center;font-size:1.4rem;margin-bottom:8px;}
.thanks-box p{font-size:0.9rem;line-height:1.55;opacity:.8;}
.thanks-box p + p{margin-top:8px;}
.msg-inline{font-size:0.78rem;color:var(--vermelho);margin-top:8px;min-height:1em;}
.btn-retry{display:block;margin:0 auto 6px;background:var(--dourado);color:var(--carvao);padding:11px 22px;border-radius:12px;font-weight:800;font-size:0.85rem;}
.voltar{display:block;text-align:center;margin-top:6px;font-size:0.85rem;font-weight:700;color:var(--carvao-soft);text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="material-symbols-outlined" style="font-size:22px;vertical-align:-3px;">local_pizza</span> Douratta Pizzaria</h1>
    <div class="sub">Acompanhe seu pedido</div>
  </div>
  <div id="conteudo"><div class="loading-note">Carregando pedido…</div></div>
  <a class="voltar" href="https://douratta.com.br/app/cardapio">Voltar ao cardápio</a>
</div>

<script>
/* =========================================================
   /pedidos?id=ID_DO_PEDIDO — página única e dinâmica.
   Lê o id da URL, pergunta ao Google Apps Script (ação "statusPedido")
   e mostra só os dados daquele pedido. Nunca acessa a planilha direto.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbz8qL33hAbb17yvAN8OvbSYN4xaH6NVdtLwZ65g_0IWz3pMyGI6p2wyRNDnb-cWVZec/exec';
// O Pix (chave, nome do recebedor e QR Code) agora vem pronto do Apps Script,
// que lê a chave da aba "Config" da planilha (mesmo padrão de /infopedido).

const POLL_MS = 8000;        // mesmo intervalo do acompanhamento dentro do cardápio
const TIMEOUT_MS = 20000;    // Apps Script pode demorar na primeira chamada
const ID_VALIDO_ = /^[A-Za-z0-9_-]{3,40}$/;   // mesmo formato que o Apps Script aceita
const MSG_SEM_ID = 'Não foi possível identificar o pedido.';
const MSG_NAO_ENCONTRADO = 'Pedido não encontrado.';
const MSG_ERRO = 'Não foi possível consultar o pedido. Tente novamente.';

// Status do pedido = os que já existem no Apps Script/planilha (coluna "status"):
// novo → aceito → em_preparo → finalizado → em_rota → entregue
const TRACK_ORDEM_ = ['novo','aceito','em_preparo','finalizado','em_rota','entregue'];
const TRACK_ETAPAS_ = [
  { chave:'aceito',      label:'Pedido aceito' },
  { chave:'em_preparo',  label:'Preparando seu pedido' },
  { chave:'finalizado',  label:'Pedido finalizado' },
  { chave:'em_rota',     label:'Saiu para entrega' },
  { chave:'entregue',    label:'Entregue' }
];
const TRACK_ICONES_ = {
  aceito: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  em_preparo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 2v6l4-2"/></svg>',
  finalizado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  em_rota: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M2 18h2m2 0h7V8H6L2 12v6z"/><path d="M13 8h4l3 4v6h-2"/></svg>',
  entregue: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  espera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

let pedidoId_ = '';
let renderizado_ = false;
let statusRenderizado_ = null;
let pollTimer_ = null;
let consultando_ = false;

function $(id){ return document.getElementById(id); }
// Tudo que vem da planilha (nome, sabores, observações…) passa por aqui antes de ir pro HTML.
function esc_(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

/* ---------- itens do pedido ---------- */
function itemHtml_(it){
  const qty = Number(it.qty)||0;
  const preco = `<div class="preco">${it.resgatado?'Resgatado com moedas':formatBRL(it.valor)}</div>`;
  if(it.tipo==='pizza'){
    const sab = (it.sabores||[]).map(s=>esc_(s.nome)).join(' + ');
    const detalhes = (it.sabores||[]).map(s=>{
      const partes = [];
      if(s.removidos&&s.removidos.length) partes.push('sem '+s.removidos.map(esc_).join(', '));
      if(s.adicionados&&s.adicionados.length) partes.push('+ '+s.adicionados.map(esc_).join(', '));
      return partes.length ? `${esc_(s.nome)} (${partes.join(' · ')})` : '';
    }).filter(Boolean).join(' · ');
    return `<div class="item">
      <div class="nome">${qty}x Pizza ${esc_(it.tamanho||'')} — ${sab}</div>
      ${it.borda?`<div class="det">Borda: ${esc_(it.borda)}</div>`:''}
      ${detalhes?`<div class="det">${detalhes}</div>`:''}
      ${it.obs?`<div class="det">Obs.: ${esc_(it.obs)}</div>`:''}
      ${preco}
    </div>`;
  }
  return `<div class="item">
    <div class="nome">${qty}x ${esc_(it.nome)}</div>
    ${(it.removidos&&it.removidos.length)?`<div class="det">Sem: ${it.removidos.map(esc_).join(', ')}</div>`:''}
    ${(it.adicionados&&it.adicionados.length)?`<div class="det">Com: ${it.adicionados.map(esc_).join(', ')}</div>`:''}
    ${it.obs?`<div class="det">Obs.: ${esc_(it.obs)}</div>`:''}
    ${preco}
  </div>`;
}

/* ---------- consulta ao Apps Script ---------- */
// Devolve { tipo:'ok', dados } | { tipo:'nao_encontrado' } | { tipo:'erro' }.
// O texto de erro do servidor NUNCA vai pra tela — só as mensagens fixas acima.
async function consultarPedido_(id){
  const ctrl = ('AbortController' in window) ? new AbortController() : null;
  const to = ctrl ? setTimeout(()=>ctrl.abort(), TIMEOUT_MS) : null;
  try{
    const resp = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ acao:'statusPedido', id }),
      signal: ctrl ? ctrl.signal : undefined
    });
    const data = await resp.json();
    if(data && data.ok === true){
      // garante que o que voltou é mesmo o pedido pedido (nada de misturar pedidos)
      if(String(data.id) !== id) return { tipo:'erro' };
      return { tipo:'ok', dados:data };
    }
    if(data && (data.codigo==='nao_encontrado' || data.codigo==='id_invalido' || data.erro===MSG_NAO_ENCONTRADO)){
      return { tipo:'nao_encontrado' };
    }
    return { tipo:'erro' };
  } catch(e){
    return { tipo:'erro' };
  } finally {
    if(to) clearTimeout(to);
  }
}

/* ---------- telas ---------- */
function mostrarMensagem_(texto, comRetry){
  $('conteudo').innerHTML =
    `<div class="empty-note">${esc_(texto)}</div>` +
    (comRetry ? `<button class="btn-retry" onclick="tentarNovamente_()">Tentar novamente</button>` : '');
}

function statusHtml_(p){
  const st = TRACK_ORDEM_.indexOf(p.status) > -1 ? p.status : 'novo';

  // Pedido entregue: só esta parte da tela muda — vira o agradecimento.
  // (Nome, itens, forma de pagamento e Pix continuam aparecendo embaixo.)
  if(st === 'entregue'){
    return `<div class="thanks-box">
      <div class="ico-big">${TRACK_ICONES_.entregue}</div>
      <h2>Bom apetite!</h2>
      <p>Seu pedido foi entregue. Muito obrigado por escolher a Douratta Pizzaria!</p>
      <p>Esperamos que você aproveite cada pedaço. Volte sempre — vai ser um prazer te atender de novo.</p>
    </div>`;
  }

  const idxAtual = TRACK_ORDEM_.indexOf(st);
  const emEspera = st === 'novo';
  const passos = [
    `<div class="track-step ${emEspera?'current':'done'}">
      <div class="ico" data-spin="${emEspera?'1':'0'}">${TRACK_ICONES_.espera}</div>
      <div class="txt">Aguardando confirmação</div>
    </div>`
  ];
  TRACK_ETAPAS_.forEach(et=>{
    const idxEtapa = TRACK_ORDEM_.indexOf(et.chave);
    const isDone = idxAtual > idxEtapa;
    const isCurrent = et.chave === st;
    passos.push(`<div class="track-step ${isDone?'done':''} ${isCurrent?'current':''}">
      <div class="ico" data-spin="${isCurrent && et.chave==='em_preparo' ? '1':'0'}">${TRACK_ICONES_[et.chave]}</div>
      <div class="txt">${et.label}</div>
    </div>`);
  });
  // Botão do cliente: aparece quando o pedido saiu para entrega (é a única etapa em que
  // o Apps Script aceita a confirmação — "confirmarEntregaCliente").
  const botao = st === 'em_rota' ? `
    <div class="confirm-hint">Recebeu seu pedido? Confirme aqui.</div>
    <button class="btn-recebi" onclick="confirmarEntrega_(this)">
      <span class="material-symbols-outlined" style="font-size:18px;">check_circle</span> Confirmar entrega
    </button>` : '';
  return `
    <h2><span class="material-symbols-outlined">local_shipping</span> Status do pedido</h2>
    <div class="track-steps">${passos.join('')}</div>
    ${botao}
    <div class="msg-inline" id="msgStatus" role="status"></div>`;
}

function atualizarStatus_(p){
  const st = p.status || 'novo';
  if(st === statusRenderizado_) return;   // sem mudança: não redesenha (evita piscar)
  statusRenderizado_ = st;
  const el = $('cardStatus');
  if(el) el.innerHTML = statusHtml_(p);
}

function render_(p){
  statusRenderizado_ = p.status || 'novo';
  const pix = p.pix || null;
  const qrPixUrl = pix ? `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(pix.payload)}` : '';
  const pixCardHtml = pix
    ? `<img src="${qrPixUrl}" alt="QR Code Pix">
      <div class="pix-chave" id="pixChaveTxt">${esc_(pix.recebedor||'')}</div>
      <button class="btn-copiar" onclick="copiarPix_()">
        <span class="material-symbols-outlined" style="font-size:17px;">content_copy</span>
        Copiar código Pix (copia e cola)
      </button>
      <div class="aviso">O QR Code já vem com o valor de ${formatBRL(p.total)} preenchido — é só escanear no app do banco e confirmar.</div>`
    : `<div class="aviso">QR Code Pix indisponível. ${esc_(p.pixAviso || 'Não foi possível gerar o Pix deste pedido.')}</div>`;

  $('conteudo').innerHTML = `
    <div class="card" id="cardStatus">${statusHtml_(p)}</div>

    <div class="card">
      <span class="status-tag">Pedido ${esc_(p.id)}</span>
      <h2><span class="material-symbols-outlined">person</span> ${esc_(p.nome||'Cliente')}</h2>
      <div class="linha"><span>Forma de pagamento</span><span><b>${esc_(p.formaPagamento||'')}</b></span></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">restaurant_menu</span> Itens do pedido</h2>
      ${(p.itens||[]).map(itemHtml_).join('')}
      <div class="linha" style="margin-top:8px;"><span>Subtotal</span><span>${formatBRL(p.subtotal)}</span></div>
      <div class="linha"><span>Frete</span><span>${formatBRL(p.frete)}</span></div>
      ${Number(p.desconto)?`<div class="linha"><span>Desconto</span><span>-${formatBRL(p.desconto)}</span></div>`:''}
      <div class="total-row"><span>Total a cobrar</span><span class="valor">${formatBRL(p.total)}</span></div>
    </div>

    <div class="card pix-card">
      <h2 style="justify-content:center;"><span class="material-symbols-outlined">qr_code_2</span> Pagamento via Pix</h2>
      ${pixCardHtml}
    </div>
  `;
  window._payloadPixAtual = pix ? pix.payload : '';
}

function copiarPix_(){
  const texto = window._payloadPixAtual || '';
  if(!texto) return;
  if(navigator.clipboard){
    navigator.clipboard.writeText(texto).then(()=>alert('Código Pix copiado!'));
  } else {
    alert('Não foi possível copiar automaticamente. Copie o código exibido na tela.');
  }
}

/* ---------- "Já recebi meu pedido" (ação que já existe no Apps Script) ---------- */
async function confirmarEntrega_(btn){
  if(btn.disabled) return;
  btn.disabled = true;
  const msg = $('msgStatus');
  if(msg) msg.textContent = '';
  try{
    const resp = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ acao:'confirmarEntregaCliente', id: pedidoId_ })
    });
    const data = await resp.json();
    if(data && data.ok === true){
      pararPolling_();
      atualizarStatus_({ status:'entregue' });
      return;
    }
  } catch(e){ /* cai na mensagem abaixo */ }
  if(msg) msg.textContent = 'Não foi possível confirmar agora. Tente novamente.';
  btn.disabled = false;
}

/* ---------- atualização automática do status ---------- */
function pararPolling_(){ if(pollTimer_){ clearInterval(pollTimer_); pollTimer_ = null; } }
function agendarPolling_(){
  pararPolling_();
  pollTimer_ = setInterval(()=>{ if(!document.hidden) buscar_(); }, POLL_MS);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && renderizado_ && pollTimer_) buscar_(); });

async function buscar_(){
  if(consultando_) return;
  consultando_ = true;
  try{
    const r = await consultarPedido_(pedidoId_);
    if(r.tipo === 'ok'){
      if(!renderizado_){ render_(r.dados); renderizado_ = true; }
      else atualizarStatus_(r.dados);
      if((r.dados.status||'novo') === 'entregue') pararPolling_();
      else if(!pollTimer_) agendarPolling_();
    } else if(!renderizado_){
      mostrarMensagem_(r.tipo==='nao_encontrado' ? MSG_NAO_ENCONTRADO : MSG_ERRO, r.tipo==='erro');
    }
    // Se a tela já estava montada e essa atualização falhou, mantém o que está na
    // tela e tenta de novo no próximo ciclo.
  } finally {
    consultando_ = false;
  }
}

function tentarNovamente_(){
  $('conteudo').innerHTML = '<div class="loading-note">Carregando pedido…</div>';
  buscar_();
}

/* ---------- início: lê ?id= da URL ---------- */
function iniciar_(){
  const bruto = new URLSearchParams(location.search).get('id');
  const id = (bruto || '').trim();
  if(!id){ mostrarMensagem_(MSG_SEM_ID); return; }
  if(!ID_VALIDO_.test(id)){ mostrarMensagem_(MSG_NAO_ENCONTRADO); return; }
  pedidoId_ = id;
  buscar_();
}
iniciar_();
</script>
</body>
</html>
