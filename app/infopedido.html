<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Pedido — Douratta Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<style>
:root{
  --dourado:#F9B31A; --dourado-dark:#C6870A;
  --vermelho:#D31A1B; --verde:#2E8B45; --verde-pale:#E4F3E8;
  --avorio:#FFFBF2; --avorio-dark:#F1E7D2;
  --carvao:#211A0F; --carvao-soft:#3A2E18;
  --linha:rgba(33,26,15,0.10);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--avorio-dark);color:var(--carvao);min-height:100vh;-webkit-font-smoothing:antialiased;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 22;font-size:20px;vertical-align:middle;}
button{font-family:inherit;border:none;cursor:pointer;}
.wrap{max-width:440px;margin:0 auto;padding:22px 16px 50px;}
.top{text-align:center;margin-bottom:16px;}
.top h1{font-family:var(--font-display);font-size:1.3rem;font-weight:700;}
.top .sub{font-size:0.8rem;opacity:.6;margin-top:2px;}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 22px rgba(33,26,15,0.07);margin-bottom:16px;}
.card h2{font-family:var(--font-display);font-size:1.02rem;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.linha{display:flex;justify-content:space-between;gap:10px;font-size:0.85rem;padding:6px 0;border-bottom:1px dashed var(--linha);}
.linha:last-child{border-bottom:none;}
.item{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--linha);}
.item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.item .nome{font-weight:800;font-size:0.92rem;margin-bottom:3px;}
.item .det{font-size:0.78rem;opacity:.75;margin-top:2px;}
.item .preco{font-weight:700;color:var(--vermelho);font-size:0.85rem;margin-top:4px;}
.total-row{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:2px solid var(--carvao);}
.total-row .valor{font-family:var(--font-display);font-weight:800;font-size:1.3rem;color:var(--vermelho);}
.pix-card{text-align:center;}
.pix-card img{width:190px;height:190px;border-radius:12px;margin:6px auto 12px;display:block;}
.pix-chave{font-family:var(--font-mono);font-size:0.85rem;background:var(--avorio);border-radius:10px;padding:10px 12px;word-break:break-all;margin-bottom:10px;}
.btn-copiar{width:100%;background:var(--verde);color:#fff;padding:12px;border-radius:12px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.aviso{font-size:0.74rem;opacity:.6;margin-top:10px;line-height:1.4;}
.loading-note,.empty-note{text-align:center;padding:40px 16px;opacity:.6;font-size:0.88rem;}
.status-tag{display:inline-block;background:var(--dourado);color:var(--carvao);font-size:0.7rem;font-weight:800;padding:3px 10px;border-radius:99px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="material-symbols-outlined" style="font-size:22px;vertical-align:-3px;">local_pizza</span> Douratta Pizzaria</h1>
    <div class="sub">Informações do pedido — entrega</div>
  </div>
  <div id="conteudo"><div class="loading-note">Carregando pedido…</div></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz8qL33hAbb17yvAN8OvbSYN4xaH6NVdtLwZ65g_0IWz3pMyGI6p2wyRNDnb-cWVZec/exec';
// Chave Pix que recebe o pagamento do motoboy/entrega.
const PIX_CHAVE = 'mcmb013579@gmail.com';
const PIX_NOME_RECEBEDOR = 'DOURATTA PIZZARIA';
const PIX_CIDADE = 'SETE LAGOAS';

function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function semAcentoPix_(txt){
  return String(txt==null?'':txt).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x00-\x7F]/g,'');
}
function extrairIdDaUrl_(){
  const porCaminho = location.pathname.match(/\/infopedido\/([^/?#]+)/);
  if(porCaminho) return decodeURIComponent(porCaminho[1]);
  return new URLSearchParams(location.search).get('id');
}

/* ---------- monta o "Pix copia e cola" (EMV/BR Code) na mão ---------- */
function tlv_(id, valor){
  const len = String(valor.length).padStart(2,'0');
  return id + len + valor;
}
function crc16_(str){
  let crc = 0xFFFF;
  for(let i=0;i<str.length;i++){
    crc ^= str.charCodeAt(i) << 8;
    for(let j=0;j<8;j++){
      crc = (crc & 0x8000) ? ((crc<<1) ^ 0x1021) : (crc<<1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}
function montarPayloadPix_(valor, txid){
  const gui = tlv_('00','br.gov.bcb.pix');
  const chave = tlv_('01', PIX_CHAVE);
  const contaPix = tlv_('26', gui + chave);
  const mcc = tlv_('52','0000');
  const moeda = tlv_('53','986');
  const valorTlv = valor ? tlv_('54', Number(valor).toFixed(2)) : '';
  const pais = tlv_('58','BR');
  const nome = tlv_('59', semAcentoPix_(PIX_NOME_RECEBEDOR).slice(0,25));
  const cidade = tlv_('60', semAcentoPix_(PIX_CIDADE).slice(0,15));
  const txidLimpo = semAcentoPix_(txid||'').replace(/[^A-Za-z0-9]/g,'').slice(0,25) || '***';
  const dadosAdicionais = tlv_('62', tlv_('05', txidLimpo));
  const semCrc = tlv_('00','01') + contaPix + mcc + moeda + valorTlv + pais + nome + cidade + dadosAdicionais + '6304';
  return semCrc + crc16_(semCrc);
}

function itemHtml_(it){
  if(it.tipo==='pizza'){
    const sab = (it.sabores||[]).map(s=>s.nome).join(' + ');
    const detalhes = (it.sabores||[]).map(s=>{
      const partes = [];
      if(s.removidos&&s.removidos.length) partes.push('sem '+s.removidos.join(', '));
      if(s.adicionados&&s.adicionados.length) partes.push('+ '+s.adicionados.join(', '));
      return partes.length ? `${s.nome} (${partes.join(' · ')})` : '';
    }).filter(Boolean).join(' · ');
    return `<div class="item">
      <div class="nome">${it.qty}x Pizza ${it.tamanho||''} — ${sab}</div>
      ${it.borda?`<div class="det">Borda: ${it.borda}</div>`:''}
      ${detalhes?`<div class="det">${detalhes}</div>`:''}
      ${it.obs?`<div class="det">Obs.: ${it.obs}</div>`:''}
      <div class="preco">${it.resgatado?'Resgatado com moedas':formatBRL(it.valor)}</div>
    </div>`;
  }
  return `<div class="item">
    <div class="nome">${it.qty}x ${it.nome}</div>
    ${(it.removidos&&it.removidos.length)?`<div class="det">Sem: ${it.removidos.join(', ')}</div>`:''}
    ${(it.adicionados&&it.adicionados.length)?`<div class="det">Com: ${it.adicionados.join(', ')}</div>`:''}
    ${it.obs?`<div class="det">Obs.: ${it.obs}</div>`:''}
    <div class="preco">${it.resgatado?'Resgatado com moedas':formatBRL(it.valor)}</div>
  </div>`;
}

async function carregar(){
  const id = extrairIdDaUrl_();
  const el = document.getElementById('conteudo');
  if(!id){ el.innerHTML = '<div class="empty-note">Link inválido — nenhum pedido informado.</div>'; return; }
  try{
    const resp = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ acao:'statusPedido', id })
    });
    const data = await resp.json();
    if(!data.ok){ el.innerHTML = `<div class="empty-note">${data.erro||'Pedido não encontrado.'}</div>`; return; }
    render_(data);
  } catch(e){
    el.innerHTML = '<div class="empty-note">Sem conexão agora. Puxe pra atualizar ou tente de novo.</div>';
  }
}

function render_(p){
  const el = document.getElementById('conteudo');
  const payloadPix = montarPayloadPix_(p.total, p.id);
  const qrPixUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(payloadPix)}`;

  el.innerHTML = `
    <div class="card">
      <span class="status-tag">Pedido ${p.id}</span>
      <h2><span class="material-symbols-outlined">person</span> ${p.nome||'Cliente'}</h2>
      <div class="linha"><span>Forma de pagamento</span><span><b>${p.formaPagamento||''}</b></span></div>
    </div>

    <div class="card">
      <h2><span class="material-symbols-outlined">restaurant_menu</span> Itens do pedido</h2>
      ${(p.itens||[]).map(itemHtml_).join('')}
      <div class="linha" style="margin-top:8px;"><span>Subtotal</span><span>${formatBRL(p.subtotal)}</span></div>
      <div class="linha"><span>Frete</span><span>${formatBRL(p.frete)}</span></div>
      ${Number(p.desconto)?`<div class="linha"><span>Desconto</span><span>-${formatBRL(p.desconto)}</span></div>`:''}
      <div class="total-row"><span>Total a cobrar</span><span class="valor">${formatBRL(p.total)}</span></div>
    </div>

    <div class="card pix-card">
      <h2 style="justify-content:center;"><span class="material-symbols-outlined">qr_code_2</span> Pagamento via Pix</h2>
      <img src="${qrPixUrl}" alt="QR Code Pix">
      <div class="pix-chave" id="pixChaveTxt">${PIX_CHAVE}</div>
      <button class="btn-copiar" onclick="copiarPix_()">
        <span class="material-symbols-outlined" style="font-size:17px;">content_copy</span>
        Copiar código Pix (copia e cola)
      </button>
      <div class="aviso">O QR Code já vem com o valor de ${formatBRL(p.total)} preenchido — é só escanear no app do banco e confirmar.</div>
    </div>
  `;
  window._payloadPixAtual = payloadPix;
}
function copiarPix_(){
  const texto = window._payloadPixAtual || PIX_CHAVE;
  if(navigator.clipboard){
    navigator.clipboard.writeText(texto).then(()=>alert('Código Pix copiado!'));
  } else {
    alert('Chave Pix: ' + PIX_CHAVE);
  }
}
carregar();
</script>
</body>
</html>
