<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#211A0F">
<title>Pedido — Douratta Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --dourado:#F9B31A; --dourado-dark:#C6870A; --dourado-pale:#FDECC4;
  --vermelho:#D31A1B; --vermelho-dark:#9E1212; --vermelho-pale:#FBE3E3;
  --avorio:#FFFBF2; --avorio-dark:#F1E7D2;
  --carvao:#211A0F; --carvao-soft:#3A2E18;
  --bianco:#FFFFFF; --linha:rgba(33,26,15,0.10);
  --verde:#2E8B45; --verde-dark:#1F6B32; --verde-pale:#E4F3E8;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{font-family:var(--font-body);background:var(--avorio-dark);color:var(--carvao);min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.4;padding-bottom:env(safe-area-inset-bottom);}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--dourado);outline-offset:2px;}
.app{max-width:540px;margin:0 auto;min-height:100vh;}

/* ---------- topo escuro: identificação + cliente + ações ---------- */
.topo{background:var(--carvao);color:var(--avorio);padding:calc(14px + env(safe-area-inset-top)) 18px 20px;border-radius:0 0 24px 24px;}
.topo-linha{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.marca{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--dourado);letter-spacing:.01em;}
.pid{font-family:var(--font-mono);font-weight:600;font-size:0.74rem;opacity:.75;word-break:break-all;text-align:right;}
.data{font-size:0.78rem;opacity:.6;margin-top:2px;}
.cli-nome{font-family:var(--font-display);font-weight:600;font-size:1.9rem;line-height:1.15;margin-top:18px;overflow-wrap:anywhere;}
.cli-tel{font-family:var(--font-mono);font-weight:500;font-size:0.95rem;opacity:.85;margin-top:4px;}
.end{font-style:normal;margin-top:14px;padding:12px 14px;background:rgba(255,251,242,0.08);border-radius:14px;font-size:1.02rem;font-weight:600;line-height:1.45;overflow-wrap:anywhere;}
.end .end-linha{display:block;}
.end .end-ref{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,251,242,0.25);font-weight:500;font-size:0.9rem;color:var(--dourado-pale);}
.end.vazio{font-weight:500;opacity:.75;}
.acoes{display:flex;gap:10px;margin-top:16px;}
.btn-acao{flex:1;min-height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:800;font-size:0.95rem;letter-spacing:.04em;text-decoration:none;text-align:center;transition:transform .08s ease;}
.btn-acao:active{transform:scale(.98);}
.btn-acao svg{width:22px;height:22px;flex-shrink:0;}
.btn-rota{background:var(--dourado);color:var(--carvao);}
.btn-contato{background:transparent;color:var(--avorio);box-shadow:inset 0 0 0 2px rgba(255,251,242,0.55);}
.btn-acao[disabled],.btn-acao[aria-disabled="true"]{opacity:.38;cursor:not-allowed;pointer-events:none;}
.acao-aviso{font-size:0.74rem;opacity:.65;margin-top:8px;}

/* ---------- cartões ---------- */
main{padding:16px 14px 40px;display:flex;flex-direction:column;gap:14px;}
.card{background:var(--bianco);border-radius:18px;padding:18px 16px;box-shadow:0 4px 16px rgba(33,26,15,0.07);}
.card h2{font-family:var(--font-display);font-weight:600;font-size:1.15rem;line-height:1.2;}
.resumo-itens{font-size:0.8rem;opacity:.65;margin-top:3px;}
.itens{list-style:none;margin-top:12px;}
.item{padding:12px 0;border-top:1px dashed var(--linha);}
.item:first-child{border-top:none;padding-top:2px;}
.item-topo{display:flex;align-items:baseline;gap:8px;}
.item-qty{font-family:var(--font-mono);font-weight:600;font-size:1rem;background:var(--dourado-pale);color:var(--dourado-dark);border-radius:8px;padding:1px 8px;flex-shrink:0;}
.item-nome{font-weight:800;font-size:1.02rem;flex:1;overflow-wrap:anywhere;}
.item-valor{font-weight:700;font-size:0.9rem;white-space:nowrap;opacity:.8;}
.item-corpo{margin:7px 0 0 0;display:flex;flex-direction:column;gap:6px;}
.sabor{padding-left:10px;border-left:3px solid var(--dourado);}
.sabor-nome{font-weight:700;font-size:0.95rem;}
.sabor-fr{font-family:var(--font-mono);font-size:0.72rem;font-weight:600;background:var(--avorio-dark);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.chip{font-size:0.76rem;font-weight:700;border-radius:7px;padding:2px 8px;}
.chip.sem{background:var(--vermelho-pale);color:var(--vermelho-dark);}
.chip.com{background:var(--verde-pale);color:var(--verde-dark);}
.chip.neutro{background:var(--avorio-dark);color:var(--carvao-soft);}
.chip.moedas{background:var(--dourado-pale);color:var(--dourado-dark);}
.info-linha{font-size:0.88rem;font-weight:600;}
.obs{background:var(--dourado-pale);border-radius:10px;padding:8px 10px;font-size:0.88rem;font-weight:600;overflow-wrap:anywhere;}
.vazio-nota{font-size:0.9rem;opacity:.6;margin-top:10px;}

.linhas{margin-top:10px;}
.linha{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:0.95rem;}
.linha .rot{opacity:.75;}
.linha .val{font-weight:700;white-space:nowrap;}
.linha.desc .val{color:var(--verde-dark);}
.linha.total{margin-top:6px;padding-top:12px;border-top:2px solid var(--carvao);align-items:baseline;}
.linha.total .rot{font-family:var(--font-display);font-weight:600;font-size:1.05rem;opacity:1;}
.linha.total .val{font-family:var(--font-display);font-weight:700;font-size:1.7rem;color:var(--vermelho);}
.pagto{margin-top:12px;padding:11px 12px;background:var(--avorio);border-radius:12px;font-size:0.92rem;}
.pagto b{font-weight:800;}
.pagto .troco{margin-top:4px;font-weight:800;color:var(--vermelho-dark);}

/* ---------- Pix ---------- */
.card.pix{border:2px solid var(--dourado);text-align:center;padding:20px 16px 18px;}
.card.pix h2{margin-bottom:2px;}
.pix-valor{font-family:var(--font-display);font-weight:700;font-size:2.4rem;line-height:1.1;color:var(--carvao);margin-top:6px;}
.pix-sub{font-size:0.8rem;opacity:.65;margin-top:2px;}
.pix-qr{width:min(78vw,290px);aspect-ratio:1/1;margin:16px auto 4px;background:#fff;border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--linha);display:flex;align-items:center;justify-content:center;}
.pix-qr img{width:100%;height:100%;display:block;image-rendering:pixelated;}
.btn-copiar{margin-top:14px;width:100%;min-height:52px;border-radius:13px;background:var(--carvao);color:var(--avorio);font-weight:800;font-size:0.9rem;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-copiar.ok{background:var(--verde);}
.btn-copiar svg{width:19px;height:19px;}
.pix-rec{font-size:0.76rem;opacity:.6;margin-top:10px;}
.aviso{background:var(--dourado-pale);color:var(--carvao);border-radius:12px;padding:12px 14px;font-size:0.88rem;font-weight:600;text-align:left;margin-top:12px;}

/* ---------- estados: carregando / erro ---------- */
.estado{background:var(--bianco);border-radius:18px;padding:28px 20px;text-align:center;box-shadow:0 4px 16px rgba(33,26,15,0.07);}
.estado h2{font-family:var(--font-display);font-size:1.3rem;margin-bottom:8px;}
.estado p{font-size:0.92rem;opacity:.75;overflow-wrap:anywhere;}
.estado .id-mono{font-family:var(--font-mono);font-weight:600;opacity:1;margin-top:10px;font-size:0.85rem;}
.estado .btn-tentar{margin-top:18px;min-height:50px;padding:0 26px;border-radius:13px;background:var(--vermelho);color:#fff;font-weight:800;}
.spinner{width:34px;height:34px;border:4px solid var(--avorio-dark);border-top-color:var(--vermelho);border-radius:50%;margin:0 auto 14px;animation:girar .7s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:2s;}.btn-acao{transition:none;}}

/* ---------- CONTATO: painel inferior ---------- */
.fundo{position:fixed;inset:0;background:rgba(33,26,15,0.55);display:none;align-items:flex-end;justify-content:center;z-index:100;}
.fundo.aberto{display:flex;}
.painel{width:100%;max-width:540px;background:var(--bianco);border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(33,26,15,0.25);}
.painel h3{font-family:var(--font-display);font-weight:600;font-size:1.15rem;}
.painel .painel-tel{font-family:var(--font-mono);font-size:0.85rem;opacity:.65;margin:2px 0 14px;}
.opcao{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 16px;border-radius:14px;font-weight:800;font-size:1rem;text-decoration:none;margin-bottom:10px;text-align:left;}
.opcao svg{width:26px;height:26px;flex-shrink:0;}
.opcao.wpp{background:var(--verde);color:#fff;}
.opcao.lig{background:var(--carvao);color:var(--avorio);}
.opcao[aria-disabled="true"]{opacity:.4;pointer-events:none;}
.opcao-cancelar{width:100%;min-height:48px;border-radius:12px;font-weight:700;color:var(--carvao-soft);background:var(--avorio-dark);}
</style>
</head>
<body>
<noscript><div style="padding:24px;text-align:center;">Ative o JavaScript do navegador para ver este pedido.</div></noscript>

<div class="app">
  <header class="topo" id="topo">
    <div class="topo-linha">
      <span class="marca">Douratta</span>
      <span class="pid" id="pid"></span>
    </div>
    <div class="data" id="dataPedido"></div>
    <div id="topoCliente"></div>
  </header>
  <main id="conteudo">
    <div class="estado" role="status"><div class="spinner" aria-hidden="true"></div><p>Buscando o pedido…</p></div>
  </main>
</div>

<!-- CONTATO: escolher WhatsApp ou ligação -->
<div class="fundo" id="fundoContato" aria-hidden="true">
  <div class="painel" role="dialog" aria-modal="true" aria-labelledby="tituloContato">
    <h3 id="tituloContato">Falar com o cliente</h3>
    <div class="painel-tel" id="telContato"></div>
    <a class="opcao wpp" id="opWpp" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11 11 0 0 0 2.7 17.2L2 22l4.9-1.3A11 11 0 1 0 20.5 3.5zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.2-3.1.8.8-3-.2-.3A9 9 0 1 1 12 20.5zm5-6.7c-.3-.1-1.6-.8-1.9-.9s-.5-.1-.6.1-.7.9-.9 1.1-.3.2-.6.1a7.3 7.3 0 0 1-3.6-3.1c-.3-.5.3-.5.8-1.5.1-.2 0-.3 0-.5l-.9-2.1c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4.1c1.7.7 2.4.8 3.3.7a2.8 2.8 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.6-.3z"/></svg>
      Conversar no WhatsApp
    </a>
    <a class="opcao lig" id="opLigar" href="#">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      Ligar
    </a>
    <button type="button" class="opcao-cancelar" id="btnFecharContato">Cancelar</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — mesma URL do Apps Script usada pelo painel e
   pelo cardápio (Code.gs → implantação "App da Web").
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbz8qL33hAbb17yvAN8OvbSYN4xaH6NVdtLwZ65g_0IWz3pMyGI6p2wyRNDnb-cWVZec/exec';
const TIMEOUT_MS = 25000;
// Mesma regra de validação do Apps Script (normalizarIdPedido_).
const ID_RE = /^[A-Za-z0-9_-]{3,40}$/;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function esc(v){
  return String(v == null ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
function brl(v){ return BRL.format(Number(v) || 0); }
function num(v){ const n = Number(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : 0; }
function semAcento(s){ return String(s||'').normalize ? String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase() : String(s||'').toLowerCase(); }
function plural(n, s, p){ return n + ' ' + (n === 1 ? s : p); }

function formatarDataHora(v){
  const d = new Date(v);
  if(!v || isNaN(d.getTime())) return '';
  const opt = { timeZone:'America/Sao_Paulo' };
  const dia = d.toLocaleDateString('pt-BR', Object.assign({ day:'2-digit', month:'2-digit', year:'numeric' }, opt));
  const hora = d.toLocaleTimeString('pt-BR', Object.assign({ hour:'2-digit', minute:'2-digit' }, opt));
  return dia + ' às ' + hora;
}

/* ---------- telefone ---------- */
function soDigitos(v){ return String(v == null ? '' : v).replace(/\D/g,''); }
// Devolve só dígitos com DDI 55 (ex.: 5531998512555) ou '' se não der pra montar.
function telefoneInternacional(v){
  let d = soDigitos(v);
  if(d.length >= 11 && d.charAt(0) === '0') d = d.replace(/^0+/, '');
  if(d.length >= 12 && d.length <= 13 && d.indexOf('55') === 0) return d;
  if(d.length === 10 || d.length === 11) return '55' + d;
  return '';
}
function telefoneBonito(v){
  let d = soDigitos(v);
  if(d.length >= 12 && d.indexOf('55') === 0) d = d.slice(2);
  if(d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if(d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return String(v == null ? '' : v).trim();
}

/* ---------- endereço / rota ---------- */
function linhasEndereco(txt){
  return String(txt || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
}
// Destino pro Google Maps, montado do endereço do próprio pedido: tira o
// "Ref.:" (ponto de referência não ajuda a localizar no mapa) e o
// prefixo "Bairro "; se o texto não citar a cidade (pedidos antigos),
// acrescenta a cidade/UF de entrega vinda da Config da planilha.
function destinoMapa(enderecoTexto, entrega){
  const partes = linhasEndereco(enderecoTexto)
    .filter(l => !/^ref\.?\s*:/i.test(l))
    .map(l => l.replace(/^bairro\s+/i, ''));
  if(!partes.length) return '';
  let dest = partes.join(', ');
  const cidade = (entrega && entrega.cidade) || '';
  if(cidade && semAcento(dest).indexOf(semAcento(cidade)) === -1){
    dest += ', ' + cidade + ((entrega && entrega.uf) ? ' - ' + entrega.uf : '');
  }
  return dest;
}
// Sem "origin": o Google Maps usa a localização atual do entregador
// como partida e o endereço do cliente como destino.
function linkRota(destino){
  return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(destino);
}

/* ---------- ícones (SVG inline) ---------- */
const ICO_ROTA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 11.3l-9-9a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4zM14 14v-3H10v3H8v-4a1 1 0 0 1 1-1h5V6l4 4-4 4z"/></svg>';
const ICO_FONE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const ICO_COPIAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>';
const ICO_OK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';

/* ---------- itens do pedido ---------- */
function chipsHtml(removidos, adicionados){
  const c = [];
  (Array.isArray(removidos) ? removidos : []).forEach(r => c.push(`<span class="chip sem">SEM ${esc(r)}</span>`));
  (Array.isArray(adicionados) ? adicionados : []).forEach(a => c.push(`<span class="chip com">+ ${esc(a)}</span>`));
  return c.length ? `<div class="chips">${c.join('')}</div>` : '';
}
function itemHtml(it){
  if(!it || typeof it !== 'object') return '';
  const qty = Math.max(1, Math.round(num(it.qty)) || 1);
  const tipo = String(it.tipo || '').toLowerCase();
  const valor = num(it.valor);
  const valorHtml = valor > 0 ? `<span class="item-valor">${brl(valor)}</span>` : '';
  let titulo = '';
  let corpo = '';

  if(tipo === 'pizza'){
    titulo = 'Pizza' + (it.tamanho ? ' ' + esc(it.tamanho) : '');
    const sabores = Array.isArray(it.sabores) ? it.sabores : [];
    if(sabores.length){
      corpo += sabores.map(s => {
        const fr = sabores.length > 1 ? `<span class="sabor-fr">1/${sabores.length}</span>` : '';
        return `<div class="sabor">${fr}<span class="sabor-nome">${esc(s && s.nome || it.nome || 'Sabor')}</span>${chipsHtml(s && s.removidos, s && s.adicionados)}</div>`;
      }).join('');
    } else if(it.nome){
      corpo += `<div class="sabor"><span class="sabor-nome">${esc(it.nome)}</span></div>`;
    }
  } else if(tipo === 'bebida'){
    titulo = esc(it.nome || 'Bebida');
    corpo += `<div class="chips"><span class="chip neutro">Bebida</span></div>`;
  } else {
    titulo = esc(it.nome || 'Item');
    const ch = chipsHtml(it.removidos, it.adicionados);
    if(ch) corpo += ch;
  }
  if(it.borda) corpo += `<div class="info-linha">Borda: ${esc(it.borda)}</div>`;
  if(it.obs) corpo += `<div class="obs">Obs.: ${esc(it.obs)}</div>`;
  if(it.resgatado) corpo += `<div class="chips"><span class="chip moedas">Resgatado com moedas</span></div>`;

  return `<li class="item">
    <div class="item-topo"><span class="item-qty">${qty}×</span><span class="item-nome">${titulo}</span>${valorHtml}</div>
    ${corpo ? `<div class="item-corpo">${corpo}</div>` : ''}
  </li>`;
}
function resumoItens(itens){
  let pizzas = 0, bebidas = 0, outros = 0;
  itens.forEach(it => {
    if(!it || typeof it !== 'object') return;
    const q = Math.max(1, Math.round(num(it.qty)) || 1);
    const t = String(it.tipo || '').toLowerCase();
    if(t === 'pizza') pizzas += q; else if(t === 'bebida') bebidas += q; else outros += q;
  });
  const p = [];
  if(pizzas) p.push(plural(pizzas, 'pizza', 'pizzas'));
  if(bebidas) p.push(plural(bebidas, 'bebida', 'bebidas'));
  if(outros) p.push(plural(outros, 'outro item', 'outros itens'));
  return p.join(', ');
}

/* ---------- QR Code (gerado no navegador) ---------- */
function qrDataUrl(texto, tamanho){
  try{
    if(typeof QRCode === 'undefined') return '';
    const box = document.createElement('div');
    new QRCode(box, { text: texto, width: tamanho, height: tamanho, correctLevel: QRCode.CorrectLevel.M });
    const cv = box.querySelector('canvas');
    return cv ? cv.toDataURL('image/png') : '';
  }catch(e){ return ''; }
}
async function copiarTexto(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

/* ---------- estados ---------- */
function mostrarEstado(titulo, texto, opts){
  opts = opts || {};
  $('topo').style.borderRadius = '0 0 24px 24px';
  $('topoCliente').innerHTML = '';
  $('dataPedido').textContent = '';
  $('conteudo').innerHTML = `<div class="estado" role="alert">
    <h2>${esc(titulo)}</h2>
    <p>${esc(texto)}</p>
    ${opts.id ? `<p class="id-mono">${esc(opts.id)}</p>` : ''}
    ${opts.tentar ? `<button type="button" class="btn-tentar" id="btnTentar">Tentar de novo</button>` : ''}
  </div>`;
  if(opts.tentar) $('btnTentar').addEventListener('click', carregar);
}

/* ---------- render do pedido ---------- */
let estadoPagina = { pedido:null, entrega:null };
function renderPedido(data){
  const p = data.pedido || {};
  const entrega = data.entrega || {};
  estadoPagina = { pedido:p, entrega:entrega };
  const itens = Array.isArray(p.itens) ? p.itens : [];

  document.title = 'Pedido ' + (p.id || '') + ' — Douratta';
  $('pid').textContent = p.id || '';
  $('dataPedido').textContent = formatarDataHora(p.dataHora);

  /* --- topo: cliente + endereço + ações --- */
  const nome = String(p.nome || '').trim();
  const telTxt = telefoneBonito(p.telefone);
  const tel = telefoneInternacional(p.telefone);
  const linhas = linhasEndereco(p.enderecoTexto);
  const destino = destinoMapa(p.enderecoTexto, entrega);

  let endHtml;
  if(linhas.length){
    const principais = linhas.filter(l => !/^ref\.?\s*:/i.test(l));
    const refs = linhas.filter(l => /^ref\.?\s*:/i.test(l));
    endHtml = `<address class="end">${principais.map(l => `<span class="end-linha">${esc(l)}</span>`).join('')}${refs.map(l => `<span class="end-ref">${esc(l)}</span>`).join('')}</address>`;
  } else {
    endHtml = `<address class="end vazio">Endereço não informado neste pedido.</address>`;
  }
  const rotaBtn = destino
    ? `<a class="btn-acao btn-rota" id="btnRota" href="${esc(linkRota(destino))}" target="_blank" rel="noopener">${ICO_ROTA}VER ROTA</a>`
    : `<button type="button" class="btn-acao btn-rota" disabled>${ICO_ROTA}VER ROTA</button>`;
  const contatoBtn = soDigitos(p.telefone)
    ? `<button type="button" class="btn-acao btn-contato" id="btnContato" aria-haspopup="dialog">${ICO_FONE}CONTATO</button>`
    : `<button type="button" class="btn-acao btn-contato" disabled>${ICO_FONE}CONTATO</button>`;

  $('topoCliente').innerHTML = `
    <h1 class="cli-nome">${esc(nome || 'Cliente sem nome')}</h1>
    ${telTxt ? `<div class="cli-tel">${esc(telTxt)}</div>` : ''}
    ${endHtml}
    <div class="acoes">${rotaBtn}${contatoBtn}</div>
    ${!destino ? `<div class="acao-aviso">Sem endereço cadastrado: a rota não está disponível.</div>` : ''}
    ${!soDigitos(p.telefone) ? `<div class="acao-aviso">Sem telefone cadastrado: o contato não está disponível.</div>` : ''}`;

  if($('btnContato')) $('btnContato').addEventListener('click', () => abrirContato(nome, p.telefone, tel));

  /* --- itens --- */
  const resumo = resumoItens(itens);
  const itensHtml = itens.map(itemHtml).join('');
  const cardItens = `<section class="card" aria-labelledby="hItens">
    <h2 id="hItens">Itens do pedido</h2>
    ${resumo ? `<div class="resumo-itens">${esc(resumo)}</div>` : ''}
    ${itensHtml ? `<ul class="itens">${itensHtml}</ul>` : `<p class="vazio-nota">Nenhum item registrado neste pedido.</p>`}
  </section>`;

  /* --- valores + pagamento --- */
  const total = num(p.total);
  const linhasVal = [];
  linhasVal.push(`<div class="linha"><span class="rot">Subtotal</span><span class="val">${brl(p.subtotal)}</span></div>`);
  if(num(p.frete) > 0) linhasVal.push(`<div class="linha"><span class="rot">Taxa de entrega</span><span class="val">${brl(p.frete)}</span></div>`);
  if(num(p.desconto) > 0) linhasVal.push(`<div class="linha desc"><span class="rot">Desconto</span><span class="val">− ${brl(p.desconto)}</span></div>`);
  if(num(p.moedasUsadas) > 0) linhasVal.push(`<div class="linha"><span class="rot">Moedas usadas</span><span class="val">${esc(Math.round(num(p.moedasUsadas)))}</span></div>`);
  linhasVal.push(`<div class="linha total"><span class="rot">Total</span><span class="val">${brl(total)}</span></div>`);

  const forma = String(p.formaPagamento || '').trim();
  let pagto = '';
  if(forma){
    const troPara = num(p.trocoPara);
    let extra = '';
    if(/dinheiro/i.test(forma)){
      if(troPara > total && total > 0) extra = `<div class="troco">Cliente paga com ${brl(troPara)} — levar ${brl(troPara - total)} de troco</div>`;
      else extra = `<div>Sem troco</div>`;
    }
    pagto = `<div class="pagto">Forma de pagamento: <b>${esc(forma)}</b>${extra}</div>`;
  }
  const cardValores = `<section class="card" aria-labelledby="hValores">
    <h2 id="hValores">Valores</h2>
    <div class="linhas">${linhasVal.join('')}</div>
    ${pagto}
  </section>`;

  /* --- Pix --- */
  let cardPix = '';
  if(data.pix && data.pix.payload){
    const src = qrDataUrl(data.pix.payload, 300);
    cardPix = `<section class="card pix" aria-labelledby="hPix">
      <h2 id="hPix">Cobrar por Pix</h2>
      <div class="pix-valor">${brl(data.pix.valor != null ? data.pix.valor : total)}</div>
      <div class="pix-sub">O valor já está dentro do QR Code.</div>
      ${src
        ? `<div class="pix-qr"><img src="${esc(src)}" alt="QR Code Pix no valor de ${esc(brl(data.pix.valor != null ? data.pix.valor : total))}"></div>`
        : `<div class="aviso">Não foi possível desenhar o QR Code agora. Use o botão abaixo para copiar o código Pix.</div>`}
      <button type="button" class="btn-copiar" id="btnCopiar">${ICO_COPIAR}Copiar código Pix</button>
      ${data.pix.recebedor ? `<div class="pix-rec">Recebedor: ${esc(data.pix.recebedor)}</div>` : ''}
    </section>`;
  } else {
    cardPix = `<section class="card pix" aria-labelledby="hPix">
      <h2 id="hPix">Cobrar por Pix</h2>
      <div class="pix-valor">${brl(total)}</div>
      <div class="aviso">QR Code Pix indisponível. ${esc(data.pixAviso || 'Não foi possível gerar o Pix deste pedido.')}</div>
    </section>`;
  }

  $('conteudo').innerHTML = cardItens + cardValores + cardPix;

  if($('btnCopiar')){
    $('btnCopiar').addEventListener('click', async () => {
      const btn = $('btnCopiar');
      const ok = await copiarTexto(data.pix.payload);
      btn.classList.toggle('ok', ok);
      btn.innerHTML = ok ? ICO_OK + 'Código copiado' : ICO_COPIAR + 'Não foi possível copiar';
      setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = ICO_COPIAR + 'Copiar código Pix'; }, 2200);
    });
  }
}

/* ---------- CONTATO: painel com WhatsApp / Ligar ---------- */
let focoAnterior = null;
function abrirContato(nome, telefoneOriginal, telInternacional){
  focoAnterior = document.activeElement;
  $('tituloContato').textContent = nome ? 'Falar com ' + nome : 'Falar com o cliente';
  $('telContato').textContent = telefoneBonito(telefoneOriginal);
  const wpp = $('opWpp'), lig = $('opLigar');
  if(telInternacional){
    wpp.href = 'https://wa.me/' + telInternacional;
    wpp.removeAttribute('aria-disabled');
  } else {
    wpp.href = '#'; wpp.setAttribute('aria-disabled', 'true');
  }
  // tel: usa o número completo com +55 quando dá; senão, os dígitos como estão
  const digitos = telInternacional ? '+' + telInternacional : soDigitos(telefoneOriginal);
  lig.href = digitos ? 'tel:' + digitos : '#';
  if(!digitos) lig.setAttribute('aria-disabled', 'true'); else lig.removeAttribute('aria-disabled');
  const fundo = $('fundoContato');
  fundo.classList.add('aberto');
  fundo.setAttribute('aria-hidden', 'false');
  (telInternacional ? wpp : lig).focus();
}
function fecharContato(){
  const fundo = $('fundoContato');
  fundo.classList.remove('aberto');
  fundo.setAttribute('aria-hidden', 'true');
  if(focoAnterior && focoAnterior.focus) focoAnterior.focus();
}
$('btnFecharContato').addEventListener('click', fecharContato);
$('fundoContato').addEventListener('click', e => { if(e.target === $('fundoContato')) fecharContato(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('fundoContato').classList.contains('aberto')) fecharContato(); });
['opWpp','opLigar'].forEach(id => $(id).addEventListener('click', () => { setTimeout(fecharContato, 300); }));

/* ---------- carregamento: URL → API → tela ---------- */
function lerIdDaUrl(){
  const bruto = new URLSearchParams(window.location.search).get('pedido');
  if(bruto == null || String(bruto).trim() === '') return { erro:'ausente' };
  const id = String(bruto).trim();
  if(!ID_RE.test(id)) return { erro:'invalido' };
  return { id };
}
async function carregar(){
  const r = lerIdDaUrl();
  if(r.erro === 'ausente'){
    mostrarEstado('Pedido não informado', 'Este link não traz o número do pedido. Escaneie novamente o QR Code impresso no papel do pedido.');
    return;
  }
  if(r.erro === 'invalido'){
    mostrarEstado('Número de pedido inválido', 'O número do pedido neste link não é válido. Escaneie novamente o QR Code impresso no papel do pedido.');
    return;
  }
  const id = r.id;
  $('pid').textContent = id;
  $('conteudo').innerHTML = `<div class="estado" role="status"><div class="spinner" aria-hidden="true"></div><p>Buscando o pedido…</p></div>`;

  let data;
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), TIMEOUT_MS) : null;
  try{
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ acao:'infoPedido', pedido:id }),
      signal: ctl ? ctl.signal : undefined
    });
    data = await resp.json();
  }catch(e){
    mostrarEstado('Sem conexão', 'Não foi possível buscar o pedido agora. Verifique a internet do celular e tente de novo.', { tentar:true, id:id });
    return;
  }finally{
    if(timer) clearTimeout(timer);
  }

  if(!data || data.ok !== true){
    const cod = data && data.codigo;
    const erroTxt = String((data && data.erro) || '');
    if(cod === 'nao_encontrado'){
      mostrarEstado('Pedido não encontrado', 'Não existe pedido com este número. Confira o QR Code do papel ou avise a pizzaria.', { id:id });
    } else if(cod === 'id_invalido'){
      mostrarEstado('Número de pedido inválido', 'O número do pedido neste link não é válido. Escaneie novamente o QR Code do papel.', { id:id });
    } else if(/Ação desconhecida/i.test(erroTxt)){
      mostrarEstado('Servidor desatualizado', 'O Apps Script ainda não conhece a ação "infoPedido". Publique uma NOVA VERSÃO da implantação do Code.gs e tente de novo.', { tentar:true, id:id });
    } else {
      mostrarEstado('Não foi possível carregar', erroTxt || 'Ocorreu um erro ao consultar o pedido. Tente novamente.', { tentar:true, id:id });
    }
    return;
  }
  renderPedido(data);
}
carregar();
</script>
