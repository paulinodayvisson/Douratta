
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel — Douratta Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 22;font-size:20px;line-height:1;vertical-align:middle;display:inline-block;}
.btn-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:girarSpinner .6s linear infinite;}
.btn-spinner.dark{border-color:rgba(33,26,15,0.25);border-top-color:var(--carvao);}
@keyframes girarSpinner{to{transform:rotate(360deg);}}
:root{
  --dourado:#F9B31A; --dourado-dark:#C6870A; --dourado-pale:#FDECC4;
  --vermelho:#D31A1B; --vermelho-dark:#9E1212;
  --avorio:#FFFBF2; --avorio-dark:#F1E7D2;
  --carvao:#211A0F; --carvao-soft:#3A2E18;
  --bianco:#FFFFFF; --linha:rgba(33,26,15,0.10);
  --verde:#2E8B45; --verde-pale:#E4F3E8;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--avorio-dark);color:var(--carvao);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--bianco);border-radius:22px;padding:28px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(33,26,15,0.12);}
.login-card h1{font-family:var(--font-display);font-size:1.4rem;margin-bottom:4px;}
.login-card p{font-size:0.82rem;opacity:.65;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--linha);border-radius:12px;font-size:0.95rem;background:var(--avorio);}
.field input:focus{outline:none;border-color:var(--dourado);}
.btn-primary{width:100%;background:var(--vermelho);color:#fff;padding:13px;border-radius:12px;font-weight:700;font-size:0.92rem;}
.err-msg{color:var(--vermelho);font-size:0.8rem;margin-top:8px;min-height:1em;}

/* ---------- shell do painel ---------- */
#panelScreen{display:none;min-height:100vh;}
.topbar{background:var(--carvao);color:var(--avorio);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar h1{font-family:var(--font-display);font-size:1.15rem;font-weight:600;}
.topbar .status{font-size:0.72rem;opacity:.6;}
.topbar .sair{font-size:0.78rem;opacity:.7;text-decoration:underline;}
.tabs{display:flex;background:var(--bianco);border-bottom:1px solid var(--linha);overflow-x:auto;position:sticky;top:53px;z-index:49;}
.tab-btn{flex:1;min-width:110px;padding:13px 10px;font-weight:700;font-size:0.8rem;color:var(--carvao-soft);opacity:.55;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn.active{opacity:1;color:var(--vermelho);border-bottom-color:var(--vermelho);}
.tab-btn .count{background:var(--vermelho);color:#fff;border-radius:99px;font-size:0.68rem;padding:1px 6px;min-width:16px;}
.tab-btn svg{width:15px;height:15px;flex-shrink:0;}
.content{max-width:1100px;margin:0 auto;padding:18px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---------- cards de pedido ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.grid{grid-template-columns:1fr 1fr 1fr;}}

.order-card{background:var(--bianco);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(33,26,15,0.07);border-left:5px solid var(--dourado);}
.order-card.status-aceito{border-left-color:var(--verde);}
.order-card .oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.order-card .oc-nome{font-family:var(--font-display);font-weight:600;font-size:1.05rem;}
.order-card .oc-hora{font-size:0.72rem;opacity:.55;white-space:nowrap;}
.oc-tag{display:inline-block;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--dourado-pale);color:var(--dourado-dark);margin-bottom:8px;}
.oc-tag.aceito{background:var(--verde-pale);color:var(--verde);}
.oc-line{font-size:0.82rem;margin-bottom:3px;display:flex;gap:6px;}
.oc-line b{font-weight:700;}
.oc-line svg{width:13px;height:13px;flex-shrink:0;margin-top:2px;opacity:.6;}
.oc-itens{margin:10px 0;padding:10px 12px;background:var(--avorio);border-radius:12px;font-size:0.8rem;max-height:170px;overflow-y:auto;}
.oc-item-row{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--linha);}
.oc-item-row:last-child{margin-bottom:0;border-bottom:none;padding-bottom:0;}
.oc-item-nome{font-weight:700;margin-bottom:2px;}
.oc-item-detail{opacity:.75;font-size:0.75rem;}
.oc-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha);}
.oc-total .valor{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--vermelho);}
.oc-actions{display:flex;gap:8px;margin-top:12px;}
.btn-aceitar{flex:1;background:var(--verde);color:#fff;padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-wpp{flex:1;background:var(--dourado);color:var(--carvao);padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-wpp svg,.btn-aceitar svg{width:16px;height:16px;}

/* ---------- checklist ---------- */
.check-card{background:var(--bianco);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(33,26,15,0.07);}
.check-card h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:2px;}
.check-card .sub{font-size:0.75rem;opacity:.6;margin-bottom:12px;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);}
.check-item:last-of-type{border-bottom:none;}
.check-item.sub{padding-left:18px;}
.check-item input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--verde);flex-shrink:0;}
.check-item.done label{text-decoration:line-through;opacity:.45;}
.check-item label{font-size:0.85rem;line-height:1.4;}
.check-item .detail{display:block;font-size:0.76rem;opacity:.7;margin-top:1px;}
.check-title{font-weight:800;font-size:0.9rem;margin-top:12px;padding-bottom:4px;border-bottom:2px solid var(--carvao);}
.check-title:first-of-type{margin-top:2px;}
.tag-sem,.tag-com{display:inline-block;font-size:0.65rem;font-weight:800;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
.tag-sem{background:#FBE3E3;color:var(--vermelho-dark);}
.tag-com{background:var(--verde-pale);color:var(--verde);}
.btn-concluir{width:100%;margin-top:12px;background:var(--carvao);color:var(--avorio);padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-concluir[disabled]{background:var(--avorio-dark);color:var(--carvao-soft);opacity:.6;cursor:not-allowed;}
.btn-concluir .material-symbols-outlined{font-size:18px;}
.check-waiting{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 10px;opacity:.6;font-size:0.82rem;}
.check-waiting .material-symbols-outlined{font-size:32px;}
.check-progress{text-align:right;font-size:0.72rem;font-weight:700;opacity:.55;margin-top:6px;}

/* ---------- pontuação ---------- */
table{width:100%;border-collapse:collapse;background:var(--bianco);border-radius:14px;overflow:hidden;}
table th,table td{padding:11px 14px;text-align:left;font-size:0.85rem;border-bottom:1px solid var(--linha);}
table th{background:var(--carvao);color:var(--avorio);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;}
table td.mono{font-family:var(--font-mono);}
.pontos-num{font-weight:700;color:var(--dourado-dark);}

/* ---------- configurações / status da loja ---------- */
.config-card{background:var(--bianco);border-radius:18px;padding:20px;box-shadow:0 4px 16px rgba(33,26,15,0.07);max-width:420px;}
.config-card h3{font-family:var(--font-display);font-size:1.1rem;margin-bottom:4px;}
.config-card .sub{font-size:0.8rem;opacity:.65;}
.loja-toggle-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;}
.loja-toggle-label{font-size:0.85rem;font-weight:700;opacity:.4;transition:opacity .2s;}
.loja-toggle-label.ativo{opacity:1;}
.loja-toggle{width:56px;height:32px;border-radius:99px;background:var(--vermelho);position:relative;flex-shrink:0;transition:background .2s;}
.loja-toggle.on{background:var(--verde);}
.loja-toggle .loja-toggle-knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);transition:left .2s;}
.loja-toggle.on .loja-toggle-knob{left:27px;}
.loja-toggle[disabled]{opacity:.6;cursor:not-allowed;}

/* ---------- cardápio ---------- */
.cat-block{margin-bottom:22px;}
.cat-block h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:10px;}
.prod-edit-row{background:var(--bianco);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px;}
.prod-edit-row .nome{font-weight:700;font-size:0.88rem;flex:1;min-width:140px;}
.prod-edit-row .mini-field{display:flex;flex-direction:column;gap:3px;}
.prod-edit-row .mini-field label{font-size:0.65rem;opacity:.6;font-weight:700;}
.prod-edit-row .mini-field input{width:78px;padding:7px 8px;border:1.5px solid var(--linha);border-radius:8px;font-size:0.82rem;}
.toggle-ativo{display:flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:700;}
.btn-salvar-prod{background:var(--dourado);color:var(--carvao);padding:8px 14px;border-radius:9px;font-weight:700;font-size:0.75rem;}

.empty-note{text-align:center;padding:40px 10px;opacity:.5;font-size:0.88rem;}

/* ---------- botão "fazer pedido para outra pessoa" ---------- */
.acoes-topo{display:flex;justify-content:flex-end;margin-bottom:16px;}
.btn-outra-pessoa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--dourado);color:var(--carvao);padding:12px 18px;border-radius:12px;font-weight:800;font-size:0.82rem;letter-spacing:.02em;text-decoration:none;box-shadow:0 3px 10px rgba(198,135,10,0.25);}
.btn-outra-pessoa:hover{background:#fbbf3c;}
.btn-outra-pessoa:focus-visible{outline:3px solid var(--carvao);outline-offset:2px;}
@media(max-width:600px){.acoes-topo{justify-content:stretch;}.btn-outra-pessoa{width:100%;}}
.loading-note{text-align:center;padding:30px;opacity:.5;font-size:0.88rem;}

/* ---------- impressão térmica automática do pedido ---------- */
.btn-imprimir{flex:0 0 auto;width:44px;background:var(--carvao);color:var(--avorio);border-radius:11px;display:flex;align-items:center;justify-content:center;}
#areaImpressaoPedido{display:none;}
@media print{
  body *{visibility:hidden;}
  #areaImpressaoPedido, #areaImpressaoPedido *{visibility:visible;}
  #areaImpressaoPedido{display:block;position:absolute;top:0;left:0;width:100%;}
  /* 58mm de largura de bobina. Se a sua impressora for de 80mm, troque
     "58mm" por "80mm" aqui e também no .recibo abaixo (width). */
  @page{margin:0;size:58mm auto;}
}
/* Recibo em HTML/CSS de verdade (negrito, seções, linhas tracejadas),
   no mesmo estilo do PDF-modelo: título grande, seções em caixa alta,
   valores alinhados à direita e um checklist de produção no fim.
   Isso só funciona se a impressora imprimir a página como imagem/gráfico
   (é o que praticamente toda impressora térmica de 58mm faz quando
   instalada como impressora normal do Windows/Android e usada via
   "Imprimir" do navegador). Se a sua estiver configurada num modo
   "Generic / Text Only" que só cospe caracteres crus, ela vai ignorar
   negrito/alinhamento — nesse caso me avise que eu volto pra versão em
   texto puro monoespaçado. */
.recibo{width:50mm;margin:0 auto;padding:2mm 3mm 4mm;font-family:Arial,Helvetica,sans-serif;color:#000;font-size:12.5px;line-height:1.4;}
.recibo .r-center{text-align:center;}
.recibo .r-logo{font-size:18px;font-weight:800;letter-spacing:.3px;}
.recibo .r-marca{font-size:11px;font-weight:700;letter-spacing:3px;margin-top:-1px;}
.recibo .r-pedido{font-size:13.5px;font-weight:800;margin-top:2mm;}
.recibo .r-datahora{font-size:10.5px;opacity:.8;}
.recibo .r-dash{border:none;border-top:1px dashed #000;margin:2mm 0;}
.recibo .r-solid{border:none;border-top:2px solid #000;margin:2mm 0;}
.recibo .r-titulo{font-size:11px;font-weight:800;letter-spacing:.6px;margin-bottom:1.2mm;}
.recibo .r-row{display:flex;justify-content:space-between;gap:2mm;font-size:12px;margin-bottom:.8mm;}
.recibo .r-row b{font-weight:800;}
.recibo .r-endereco{font-size:11.5px;margin-bottom:.5mm;word-wrap:break-word;white-space:pre-line;}
.recibo .r-item{margin-bottom:1.6mm;}
.recibo .r-item-nome{display:flex;justify-content:space-between;gap:2mm;font-weight:800;font-size:12.5px;}
.recibo .r-item-det{font-size:10.5px;padding-left:2.4mm;opacity:.85;word-wrap:break-word;}
.recibo .r-total{display:flex;justify-content:space-between;font-size:15px;font-weight:800;margin:.8mm 0;}
.recibo .r-check{font-size:11.5px;margin:1.2mm 0;}
.recibo .r-qr{text-align:center;margin:1.5mm 0 .5mm;}
.recibo .r-qr img{width:34mm;height:34mm;display:block;margin:0 auto;padding:1.5mm;background:#fff;image-rendering:pixelated;}
.recibo .r-qr-txt{font-size:10.5px;font-weight:700;margin-top:1mm;line-height:1.25;}
.recibo .r-foot{text-align:center;font-size:10px;opacity:.7;margin-top:3mm;}
</style>
</head>
<body>

<div id="areaImpressaoPedido"></div>

<div id="loginScreen">
  <div class="login-card">
    <h1>Painel Douratta</h1>
    <p>Acesso restrito da pizzaria.</p>
    <div class="field"><label>Senha do painel</label><input id="inSenhaPainel" type="password" placeholder="••••••" autofocus></div>
    <div class="err-msg" id="loginErr"></div>
    <button class="btn-primary" id="btnEntrarPainel" onclick="entrarPainel()">Entrar</button>
  </div>
</div>

<div id="panelScreen">
  <div class="topbar">
    <h1>Painel Douratta</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="status" id="statusConexao">atualizando...</span>
      <a href="#" class="sair" onclick="sairPainel();return false;">Sair</a>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="pedidos" onclick="mudarAba('pedidos')">
      <span class="material-symbols-outlined">receipt_long</span>
      Pedidos <span class="count" id="countNovos" style="display:none;">0</span>
    </button>
    <button class="tab-btn" data-tab="checklist" onclick="mudarAba('checklist')">
      <span class="material-symbols-outlined">checklist</span>
      Checklist
    </button>
    <button class="tab-btn" data-tab="pontuacao" onclick="mudarAba('pontuacao')">
      <span class="material-symbols-outlined">loyalty</span>
      Pontuação
    </button>
    <button class="tab-btn" data-tab="cardapio" onclick="mudarAba('cardapio')">
      <span class="material-symbols-outlined">restaurant_menu</span>
      Cardápio
    </button>
    <button class="tab-btn" data-tab="cacaniquel" onclick="mudarAba('cacaniquel')">
      <span class="material-symbols-outlined">redeem</span>
      Giro Premiado
    </button>
    <button class="tab-btn" data-tab="live" onclick="mudarAba('live')">
      <span class="material-symbols-outlined">live_tv</span>
      Live
    </button>
    <button class="tab-btn" data-tab="custos" onclick="mudarAba('custos')">
      <span class="material-symbols-outlined">calculate</span>
      Custos
    </button>
    <button class="tab-btn" data-tab="financeiro" onclick="mudarAba('financeiro')">
      <span class="material-symbols-outlined">monitoring</span>
      Financeiro
    </button>
    <button class="tab-btn" data-tab="configuracoes" onclick="mudarAba('configuracoes')">
      <span class="material-symbols-outlined">settings</span>
      Configurações
    </button>
  </div>
  <div class="content">
    <div class="acoes-topo">
      <a class="btn-outra-pessoa" id="btnOutraPessoa" href="https://douratta.com.br/" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">add_shopping_cart</span>
        FAZER PEDIDO PARA OUTRA PESSOA
      </a>
    </div>
    <div class="tab-panel active" id="tabPedidos"><div class="loading-note">Carregando pedidos…</div></div>
    <div class="tab-panel" id="tabChecklist"><div class="loading-note">Carregando checklist…</div></div>
    <div class="tab-panel" id="tabPontuacao"><div class="loading-note">Carregando pontuação…</div></div>
    <div class="tab-panel" id="tabCardapio"><div class="loading-note">Carregando cardápio…</div></div>
    <div class="tab-panel" id="tabCacaniquel"><div class="loading-note">Carregando…</div></div>
    <div class="tab-panel" id="tabLive"><div class="loading-note">Carregando…</div></div>
    <div class="tab-panel" id="tabCustos"><div class="loading-note">Carregando…</div></div>
    <div class="tab-panel" id="tabFinanceiro"><div class="loading-note">Carregando…</div></div>
    <div class="tab-panel" id="tabConfiguracoes"><div class="loading-note">Carregando configurações…</div></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — mesma URL do cardápio e da página de pontos.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbz8qL33hAbb17yvAN8OvbSYN4xaH6NVdtLwZ65g_0IWz3pMyGI6p2wyRNDnb-cWVZec/exec';
const LS_KEY = 'douratta_painel_senha_v1';
const POLL_MS = 15000; // intervalo de checagem de novos pedidos
// Endereço do cardápio da Douratta que o botão "FAZER PEDIDO PARA OUTRA
// PESSOA" abre (em outra aba, pra o painel continuar recebendo pedidos).
// CONFIRA/TROQUE aqui se o cardápio ficar em outro endereço.
const CARDAPIO_URL = 'https://douratta.com.br/';
// Página que o entregador abre ao escanear o QR Code impresso no papel.
// O ID real do pedido entra em ?pedido=. NÃO altere a base.
const INFOPEDIDO_URL_BASE = 'https://douratta.com.br/app/infopedido';

let senhaPainel = '';
let abaAtual = 'pedidos';
let pedidosCache = [];
let idsConhecidos = new Set();
let audioCtx = null;
let checklistState = {}; // { [pedidoId]: { [indice]: true } } — persistido no localStorage

/* ---------- som de notificação (Web Audio, sem arquivo externo) ---------- */
function habilitarAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function tocarSom(){
  if(!audioCtx) return;
  try{
    [0,0.18,0.36].forEach((delay,i)=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.value = i===2 ? 880 : 660;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+delay+0.28);
      o.start(audioCtx.currentTime+delay);
      o.stop(audioCtx.currentTime+delay+0.3);
    });
  }catch(e){}
}

/* ---------- helpers ---------- */
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatHora(d){ const dt = new Date(d); return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }

/* =========================================================
   IMPRESSÃO TÉRMICA — RECIBO EM HTML, no padrão do PDF-modelo
   (Douratta / 58mm): título grande, seções em caixa alta, valores
   alinhados à direita com flexbox e checklist de produção no fim.
   Acentos são mantidos normalmente — isso só funciona se a impressora
   imprimir a página como imagem (é o normal pra impressora térmica
   instalada como impressora do sistema e usada via "Imprimir" do
   navegador). Se a sua estiver em modo "Generic / Text Only" (só
   texto cru, sem negrito/alinhamento), me avise que eu volto pra
   versão em texto puro.
   ========================================================= */
function escaparHtml_(txt){
  return String(txt==null?'':txt)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// Uma linha de item do pedido: nome/qtd em negrito (+ preço, se o
// pedido trouxer isso no item — campo "preco" ou "precoUnit"), e os
// detalhes (sabor, borda, sem/com ingrediente, observação) embaixo,
// em fonte menor, igual ao PDF-modelo.
function itemImpressaoHtml_(it){
  let titulo = '';
  const dets = [];
  const precoItem = (it.preco!=null && it.preco!=='') ? Number(it.preco)
                   : (it.precoUnit!=null && it.precoUnit!=='') ? Number(it.precoUnit) : null;
  if(it.tipo==='pizza'){
    titulo = `${it.qty}x Pizza ${it.tamanho||''}`.trim();
    (it.sabores||[]).forEach(s=>{
      dets.push(`Sabor: ${s.nome}`);
      (s.removidos||[]).forEach(r=>dets.push(`SEM ${r}`));
      (s.adicionados||[]).forEach(a=>dets.push(`+ ${a} (extra)`));
    });
    if(it.borda) dets.push(`Borda: ${it.borda}`);
    if(it.obs) dets.push(`Obs.: ${it.obs}`);
    if(it.resgatado) dets.push('** RESGATADO COM MOEDAS **');
  } else if(it.tipo==='bebida'){
    titulo = `${it.qty}x ${it.nome}`;
  } else {
    titulo = `${it.qty}x ${it.nome}`;
    (it.removidos||[]).forEach(r=>dets.push(`SEM ${r}`));
    (it.adicionados||[]).forEach(a=>dets.push(`+ ${a} (extra)`));
    if(it.borda) dets.push(`Borda: ${it.borda}`);
    if(it.obs) dets.push(`Obs.: ${it.obs}`);
    if(it.resgatado) dets.push('** RESGATADO COM MOEDAS **');
  }
  const precoHtml = precoItem!=null ? `<span>${formatBRL(precoItem)}</span>` : '';
  return `<div class="r-item">
    <div class="r-item-nome"><span>${escaparHtml_(titulo)}</span>${precoHtml}</div>
    ${dets.map(d=>`<div class="r-item-det">${escaparHtml_(d)}</div>`).join('')}
  </div>`;
}
function reciboHtmlPedido_(p){
  const dt = new Date(p.dataHora);
  const dataStr = dt.toLocaleDateString('pt-BR');
  const horaStr = dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const totalNum = Number(p.total)||0;
  const trocoParaNum = Number(p.trocoPara)||0;
  const ehDinheiro = /dinheiro/i.test(p.formaPagamento||'');
  const troco = (ehDinheiro && trocoParaNum>0) ? Math.max(0, trocoParaNum-totalNum) : null;
  // enderecoTexto é o endereço legível (novo campo); em pedidos bem
  // antigos, sem esse campo, cai pro que tiver em "endereco".
  const endereco = p.enderecoTexto || p.endereco || '';

  let h = '';
  h += `<div class="r-center r-logo">DOURATTA</div>`;
  h += `<div class="r-center r-marca">PIZZARIA</div>`;
  h += `<div class="r-center r-pedido">PEDIDO ${escaparHtml_(p.id||'')}</div>`;
  h += `<div class="r-center r-datahora">${dataStr} • ${horaStr}</div>`;
  h += `<hr class="r-solid">`;
  h += `<div class="r-titulo">CLIENTE</div>`;
  h += `<div class="r-row"><span>${escaparHtml_(p.nome||'')}</span></div>`;
  if(p.telefone) h += `<div class="r-row"><span>WhatsApp: ${escaparHtml_(p.telefone)}</span></div>`;
  h += `<hr class="r-dash">`;
  h += `<div class="r-titulo">ENTREGA</div>`;
  h += `<div class="r-endereco">${escaparHtml_(endereco || 'Retirada no balcão')}</div>`;
  h += `<hr class="r-dash">`;
  h += `<div class="r-titulo">ITENS DO PEDIDO</div>`;
  (p.itens||[]).forEach(it=>{ h += itemImpressaoHtml_(it); });
  h += `<hr class="r-dash">`;
  h += `<div class="r-titulo">RESUMO</div>`;
  h += `<div class="r-row"><span>Subtotal</span><span>${formatBRL(p.subtotal)}</span></div>`;
  h += `<div class="r-row"><span>Taxa de entrega</span><span>${formatBRL(p.frete)}</span></div>`;
  if(Number(p.desconto)) h += `<div class="r-row"><span>Desconto</span><span>-${formatBRL(p.desconto)}</span></div>`;
  if(Number(p.moedasUsadas)) h += `<div class="r-row"><span>Moedas usadas</span><span>${p.moedasUsadas}</span></div>`;
  h += `<hr class="r-dash">`;
  h += `<div class="r-total"><span>TOTAL</span><span>${formatBRL(p.total)}</span></div>`;
  h += `<hr class="r-dash">`;
  h += `<div class="r-titulo">PAGAMENTO</div>`;
  h += `<div class="r-row"><span>${escaparHtml_(p.formaPagamento||'')}</span></div>`;
  if(trocoParaNum) h += `<div class="r-row"><span>Recebido</span><span>${formatBRL(trocoParaNum)}</span></div>`;
  if(troco!=null) h += `<div class="r-row"><b>TROCO</b><b>${formatBRL(troco)}</b></div>`;
  if(p.codigoIndicacao) h += `<div class="r-row"><span>Indicação</span><span>${escaparHtml_(p.codigoIndicacao)}</span></div>`;
  h += `<hr class="r-solid">`;
  // QR Code do pedido: o entregador escaneia direto no papel e abre
  // https://douratta.com.br/app/infopedido?pedido=ID_DO_PEDIDO
  const qrSrc = qrImagemSrc_(linkInfoPedido_(p.id));
  h += `<div class="r-qr"><img src="${escaparHtml_(qrSrc)}" alt="QR Code do pedido"><div class="r-qr-txt">ENTREGADOR: escaneie para ver rota, contato e Pix</div></div>`;
  h += `<div class="r-foot">Obrigado pela preferência!<br>douratta.com.br</div>`;
  return h;
}
// Gera o QR Code no próprio navegador (biblioteca qrcodejs, já carregada
// no <head>) e devolve como data URI — assim funciona na hora, sem
// depender de internet na hora de imprimir. Se a biblioteca não tiver
// carregado, cai pra um serviço externo de QR como plano B.
function qrImagemSrc_(texto){
  try{
    if(typeof QRCode !== 'undefined'){
      const box = document.createElement('div');
      new QRCode(box, { text: texto, width: 264, height: 264, correctLevel: QRCode.CorrectLevel.M });
      const cv = box.querySelector('canvas');
      if(cv){ const url = cv.toDataURL('image/png'); if(url && url.length > 100) return url; }
    }
  }catch(e){}
  return 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data=' + encodeURIComponent(texto);
}
function imprimirPedido(p){
  if(!p){ alert('Não encontrei os dados desse pedido pra imprimir.'); return; }
  const area = document.getElementById('areaImpressaoPedido');
  area.innerHTML = `<div class="recibo">${reciboHtmlPedido_(p)}</div>`;
  // espera as imagens do recibo (QR Code) terminarem de carregar antes de
  // abrir a impressão — no máximo 2s, pra nunca travar a impressão.
  const imgs = Array.from(area.querySelectorAll('img'));
  const prontas = Promise.all(imgs.map(im=> im.complete ? Promise.resolve() : new Promise(res=>{ im.onload = im.onerror = res; })));
  Promise.race([prontas, new Promise(res=>setTimeout(res, 2000))]).then(()=>{
    setTimeout(()=>{ window.print(); }, 150);
  });
}
function reimprimirPedido(id){
  imprimirPedido(pedidosCache.find(pd=>pd.id===id));
}
// Mostra um loader dentro do próprio botão clicado (spinner + texto),
// e desabilita ele, pra pessoa nunca achar que o clique não funcionou
// enquanto espera a resposta do servidor. Se a ação der certo, o card
// costuma ser re-renderizado (o botão nem existe mais); se der erro,
// chama a função devolvida pra restaurar o botão do jeito que estava.
function setBtnLoading_(btn, textoCarregando){
  if(!btn) return null;
  const originalHtml = btn.innerHTML;
  const originalDisabled = btn.disabled;
  btn.disabled = true;
  const escuro = getComputedStyle(btn).color === 'rgb(33, 26, 15)' || btn.classList.contains('btn-salvar-prod');
  btn.innerHTML = `<span class="btn-spinner${escuro?' dark':''}"></span>${textoCarregando||'Enviando...'}`;
  return function(){ btn.disabled = originalDisabled; btn.innerHTML = originalHtml; };
}
async function apiPost(acao, dados){
  const resp = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({acao, senhaPainel}, dados))
  });
  return resp.json();
}

/* ---------- login ---------- */
async function entrarPainel(){
  const val = document.getElementById('inSenhaPainel').value.trim();
  const errEl = document.getElementById('loginErr');
  if(!val){ errEl.textContent = 'Digite a senha.'; return; }
  senhaPainel = val;
  const restaurar = setBtnLoading_(document.getElementById('btnEntrarPainel'), 'Entrando...');
  const data = await apiPost('listarPedidos', { apenasHoje:false }).catch(()=>({ok:false,erro:'Sem conexão agora.'}));
  if(!data.ok){ if(restaurar) restaurar(); errEl.textContent = data.erro || 'Senha incorreta.'; senhaPainel=''; return; }
  try{ localStorage.setItem(LS_KEY, val); }catch(e){}
  habilitarAudio();
  abrirPainel();
}
function sairPainel(){
  senhaPainel = '';
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  document.getElementById('panelScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function abrirPainel(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panelScreen').style.display = 'block';
  carregarChecklistState_();
  atualizarTudo();
  setInterval(atualizarTudo, POLL_MS);
}

/* ---------- abas ---------- */
function mudarAba(nome){
  abaAtual = nome;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===nome));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab'+nome.charAt(0).toUpperCase()+nome.slice(1)).classList.add('active');
  if(nome==='pontuacao') carregarPontuacao();
  if(nome==='cardapio') carregarCardapio();
  if(nome==='checklist') renderChecklist();
  if(nome==='configuracoes') carregarConfiguracoes();
  if(nome==='cacaniquel') carregarCacaNiquel();
  if(nome==='live') carregarLive();
  if(nome==='custos') carregarCustos();
  if(nome==='financeiro') carregarFinanceiro();
}

/* ---------- ciclo de atualização (pedidos) ---------- */
async function atualizarTudo(){
  const data = await apiPost('listarPedidos', { apenasHoje:false }).catch(()=>null);
  const statusEl = document.getElementById('statusConexao');
  if(!data || !data.ok){ statusEl.textContent = 'sem conexão'; return; }
  statusEl.textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const novosIds = data.pedidos.filter(p=>p.status==='novo').map(p=>p.id);
  const apareceuNovo = novosIds.some(id=>!idsConhecidos.has(id));
  if(apareceuNovo && idsConhecidos.size>0){ tocarSom(); }
  idsConhecidos = new Set(data.pedidos.map(p=>p.id));

  pedidosCache = data.pedidos;
  renderPedidos();
  const countEl = document.getElementById('countNovos');
  const qtdNovos = data.pedidos.filter(p=>p.status==='novo').length;
  countEl.textContent = qtdNovos;
  countEl.style.display = qtdNovos>0 ? 'inline-block' : 'none';
  if(abaAtual==='checklist') renderChecklist();
}

/* ---------- ABA PEDIDOS ---------- */
function itemResumoHtml(it){
  if(it.tipo==='pizza'){
    const sab = (it.sabores||[]).map(s=>s.nome).join(' + ');
    const extras = (it.sabores||[]).map(s=>{
      const partes = [];
      if(s.removidos&&s.removidos.length) partes.push('sem '+s.removidos.join(', '));
      if(s.adicionados&&s.adicionados.length) partes.push('+ '+s.adicionados.join(', '));
      return partes.length ? `${s.nome}: ${partes.join(' · ')}` : '';
    }).filter(Boolean).join(' | ');
    return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.tamanho||''} — ${sab||it.nome}</div>
      ${it.borda?`<div class="oc-item-detail">Borda: ${it.borda}</div>`:''}
      ${extras?`<div class="oc-item-detail">${extras}</div>`:''}
      ${it.obs?`<div class="oc-item-detail">Obs.: ${it.obs}</div>`:''}
      ${it.resgatado?`<div class="oc-item-detail" style="color:var(--dourado-dark);font-weight:700;">Resgatado com moedas</div>`:''}</div>`;
  }
  if(it.tipo==='bebida'){
    return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.nome}</div></div>`;
  }
  const partes = [];
  if(it.removidos&&it.removidos.length) partes.push('sem '+it.removidos.join(', '));
  if(it.adicionados&&it.adicionados.length) partes.push('+ '+it.adicionados.join(', '));
  return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.nome}</div>
    ${it.borda?`<div class="oc-item-detail">Borda: ${it.borda}</div>`:''}
    ${partes.length?`<div class="oc-item-detail">${partes.join(' · ')}</div>`:''}
    ${it.obs?`<div class="oc-item-detail">Obs.: ${it.obs}</div>`:''}
    ${it.resgatado?`<div class="oc-item-detail" style="color:var(--dourado-dark);font-weight:700;">Resgatado com moedas</div>`:''}</div>`;
}

  el.innerHTML = `<div class="grid">${ativos.map(p=>{
    const telStr = String(p.telefone||'');
    return `
    <div class="order-card status-${p.status}">
      <div class="oc-head">
        <div class="oc-nome">${p.nome}</div>
        <div class="oc-hora">${formatHora(p.dataHora)}</div>
      </div>
      <span class="oc-tag ${p.status==='aceito'?'aceito':''}">${p.status==='novo'?'Novo pedido':'Aceito'}</span>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">call</span> ${telStr}</div>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">location_on</span> ${(p.enderecoTexto || p.endereco || '').replace(/\n+/g,', ')}</div>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">payments</span> ${p.formaPagamento}${p.trocoPara?' · troco pra '+p.trocoPara:''}</div>
      <div class="oc-itens">${(p.itens||[]).map(itemResumoHtml).join('')}</div>
      ${p.codigoIndicacao?`<div class="oc-line">Indicação: <b>${p.codigoIndicacao}</b></div>`:''}
      ${p.moedasUsadas?`<div class="oc-line">${p.moedasUsadas} moedas usadas como desconto</div>`:''}
      <div class="oc-total"><span>Total</span><span class="valor">${formatBRL(p.total)}</span></div>
      <div class="oc-actions">
        ${p.status==='novo' ? `<button class="btn-aceitar" onclick="aceitarPedido('${p.id}', this)">
          <span class="material-symbols-outlined">check_circle</span>
          Aceitar pedido</button>` : `<button class="btn-aceitar" onclick="mudarAba('checklist')" style="background:var(--carvao);">
          <span class="material-symbols-outlined">visibility</span>
          Acompanhar preparo</button>`}
        <a class="btn-wpp" href="https://wa.me/${telStr.replace(/\D/g,'')}" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 2.7 17.2L2 22l4.9-1.3A11 11 0 1 0 20.5 3.5zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.2-3.1.8.8-3-.2-.3A9 9 0 1 1 12 20.5z"/></svg>
          WhatsApp</a>
        <button class="btn-imprimir" onclick="reimprimirPedido('${p.id}')" title="Imprimir pedido">
          <span class="material-symbols-outlined" style="font-size:19px;">print</span>
        </button>
      </div>
    </div>
  `;
  }).join('')}</div>`;
}

async function aceitarPedido(id, btn){
  const restaurar = setBtnLoading_(btn, 'Aceitando...');
  // guarda os dados completos do pedido ANTES de atualizar a lista,
  // pra ter o que imprimir mesmo que a atualização demore/falhe
  const pedidoOriginal = pedidosCache.find(pd=>pd.id===id);
  const data = await apiPost('aceitarPedido', { id }).catch(()=>({ok:false}));
  if(!data.ok){ if(restaurar) restaurar(); alert(data.erro || 'Não foi possível aceitar agora.'); return; }
  const pedidoParaImprimir = pedidoOriginal
    ? Object.assign({}, pedidoOriginal, { status:'aceito', aceitoEm: new Date().toISOString() })
    : null;
  await atualizarTudo();
  imprimirPedido(pedidoParaImprimir || pedidosCache.find(pd=>pd.id===id));
  mudarAba('checklist');
}

function carregarChecklistState_(){
  try{ checklistState = JSON.parse(localStorage.getItem('douratta_checklist_state_v1')||'{}'); }catch(e){ checklistState = {}; }
}
function salvarChecklistState_(){
  try{ localStorage.setItem('douratta_checklist_state_v1', JSON.stringify(checklistState)); }catch(e){}
}
// Link da página que o entregador vê ao escanear o QR Code do papel —
// dados do pedido, rota, contato e QR Code Pix pra cobrar a entrega.
// Formato: https://douratta.com.br/app/infopedido?pedido=ID_DO_PEDIDO
function linkInfoPedido_(id){
  return `${INFOPEDIDO_URL_BASE}?pedido=${encodeURIComponent(String(id==null?'':id).trim())}`;
}
function marcarChecklistItem(pedidoId, idx, checked){
  checklistState[pedidoId] = checklistState[pedidoId] || {};
  checklistState[pedidoId][idx] = checked;
  salvarChecklistState_();
  renderChecklist(); // re-renderiza pra também atualizar se o botão "Finalizar checklist" já pode habilitar
}
// Monta o checklist em linhas GRANULARES: cada sabor, cada ingrediente
// removido e cada adicional viram uma linha própria com checkbox — não
// é só "2x Pizza Grande", é sabor por sabor, sem-isso, com-aquilo, pra
// quem está montando não perder nada. Linhas com titulo:true são só
// cabeçalho (sem checkbox, não contam pro total de itens a marcar).
function checklistLinhasDoPedido(p){
  const linhas = [];
  (p.itens||[]).forEach(it=>{
    if(it.tipo==='pizza'){
      linhas.push({ titulo:true, texto:`${it.qty}x Pizza ${it.tamanho||''}` });
      (it.sabores||[]).forEach(s=>{
        linhas.push({ texto:`Sabor: ${s.nome}` });
        (s.removidos||[]).forEach(r=>linhas.push({ texto:`Sem ${r}`, tag:'sem', sub:true }));
        (s.adicionados||[]).forEach(a=>linhas.push({ texto:`Com ${a} extra`, tag:'com', sub:true }));
      });
      if(it.borda) linhas.push({ texto:`Borda: ${it.borda}` });
      if(it.obs) linhas.push({ texto:`Obs.: ${it.obs}`, tag:'obs' });
    } else if(it.tipo==='simples'){
      linhas.push({ titulo:true, texto:`${it.qty}x ${it.nome}` });
      (it.removidos||[]).forEach(r=>linhas.push({ texto:`Sem ${r}`, tag:'sem', sub:true }));
      (it.adicionados||[]).forEach(a=>linhas.push({ texto:`Com ${a} extra`, tag:'com', sub:true }));
      if(it.borda) linhas.push({ texto:`Borda: ${it.borda}` });
      if(it.obs) linhas.push({ texto:`Obs.: ${it.obs}`, tag:'obs' });
    } else {
      linhas.push({ titulo:true, texto:`${it.qty}x ${it.nome} (bebida)` });
    }
  });
  return linhas;
}
// Cada etapa sabe: qual o rótulo, qual ação chamar pra passar pra

function renderChecklist(){
  const hojeStr = new Date().toDateString();
  const doDia = pedidosCache.filter(p=>p.status!=='novo' && new Date(p.dataHora).toDateString()===hojeStr);
  const el = document.getElementById('tabChecklist');
  if(!doDia.length){ el.innerHTML = '<div class="empty-note">Nenhum pedido aceito hoje ainda.</div>'; return; }
  el.innerHTML = `<div class="grid">${doDia.map(p=>{
    const info = STATUS_INFO_[p.status] || STATUS_INFO_.aceito;
    const estado = checklistState[p.id] || {};

    // O checklist granular (com os checkboxes) só é mostrado durante o
    // preparo (em_preparo). Antes disso ainda não tem o que marcar;
    // depois disso já foi conferido, não precisa mostrar de novo.
    let corpoHtml = '';
    let podeAvancar = true;
    if(p.status === 'em_preparo'){
      const linhas = checklistLinhasDoPedido(p);
      const checkaveis = linhas.filter(l=>!l.titulo);
      const marcados = checkaveis.filter((l,i)=>estado[linhas.indexOf(l)]).length;
      podeAvancar = checkaveis.length===0 || marcados === checkaveis.length;
      corpoHtml = linhas.map((l,idx)=>{
        if(l.titulo) return `<div class="check-title">${l.texto}</div>`;
        const tagHtml = l.tag==='sem' ? `<span class="tag-sem">SEM</span>` : l.tag==='com' ? `<span class="tag-com">+</span>` : '';
        return `<div class="check-item ${l.sub?'sub':''} ${estado[idx]?'done':''}" id="ck-${p.id}-${idx}">
          <input type="checkbox" id="ckbox-${p.id}-${idx}" ${estado[idx]?'checked':''} onchange="marcarChecklistItem('${p.id}',${idx},this.checked)">
          <label for="ckbox-${p.id}-${idx}">${tagHtml}${l.texto}</label>
        </div>`;
      }).join('');
      if(checkaveis.length){
        corpoHtml += `<div class="check-progress">${marcados}/${checkaveis.length} conferidos</div>`;
      }
    } else if(p.status === 'aceito'){
      corpoHtml = `<div class="check-waiting"><span class="material-symbols-outlined">outdoor_grill</span>Toque em "Iniciar preparo" pra ver o checklist de ingredientes.</div>`;
    }

    const botaoHtml = info.proximaAcao
      ? `<button class="btn-concluir" ${!podeAvancar?'disabled title="Marque todos os itens do checklist primeiro"':''} onclick="avancarStatus('${p.id}','${info.proximaAcao}', this)">
          <span class="material-symbols-outlined">${info.icone}</span>${info.botao}
        </button>`
      : `<div class="sub" style="margin-top:10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;"><span class="material-symbols-outlined" style="font-size:16px;color:var(--verde);">done_all</span>Pedido entregue</div>`;

    return `<div class="check-card">
      <h3>${p.nome} <span style="font-weight:400;font-size:0.75rem;opacity:.65;">· ${info.label}</span></h3>
      <div class="sub">Pedido às ${formatHora(p.dataHora)} · Total ${formatBRL(p.total)}</div>
      ${corpoHtml}
      ${botaoHtml}
    </div>`;
  }).join('')}</div>`;
}
async function avancarStatus(id, acao, btn){

  await atualizarTudo();

.cu-card h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:8px;}
.cu-in{width:100%;padding:9px 10px;border:1.5px solid rgba(33,26,15,.2);border-radius:10px;font-size:.9rem;background:#fff;}
.cu-lb{font-size:.74rem;font-weight:700;display:block;margin:10px 0 3px;}
.cu-row{display:grid;grid-template-columns:1fr 84px 30px;gap:6px;align-items:center;margin-bottom:8px;}
.cu-rowinfo{grid-column:1/-1;font-size:.72rem;opacity:.7;margin:-4px 0 4px;}
.cu-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.cu-sum div{background:var(--avorio);border-radius:12px;padding:10px;}
.cu-sum b{display:block;font-size:1.05rem;font-family:var(--font-mono);}
.cu-sum span{font-size:.7rem;opacity:.7;}
.cu-var{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--linha);cursor:pointer;font-size:.86rem;}
.cu-var small{display:block;opacity:.65;font-size:.72rem;}
.cu-cat{font-weight:800;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;opacity:.55;margin:14px 0 2px;}
.cu-btn{background:var(--dourado);color:var(--carvao);padding:11px 16px;border-radius:10px;font-weight:800;font-size:.85rem;}
.cu-btn.sec{background:var(--avorio-dark);}
.cu-btn.red{background:var(--vermelho);color:#fff;}
.cu-x{color:var(--vermelho);font-weight:800;font-size:1.1rem;}
.cu-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;max-width:760px;}
.cu-kpi{background:var(--bianco);border-radius:14px;padding:12px;box-shadow:0 3px 12px rgba(33,26,15,.06);}
.cu-kpi span{font-size:.7rem;opacity:.65;font-weight:700;}
.cu-kpi b{display:block;font-size:1.15rem;font-family:var(--font-mono);margin-top:2px;}
.cu-pos{color:var(--verde);} .cu-neg{color:var(--vermelho);}
.cu-filtros{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.cu-filtros button{padding:7px 12px;border-radius:99px;font-size:.76rem;font-weight:700;background:var(--bianco);border:1.5px solid var(--linha);}
.cu-filtros button.on{background:var(--dourado);border-color:var(--dourado-dark);}
.cu-tbl{width:100%;border-collapse:collapse;font-size:.78rem;}
.cu-tbl th,.cu-tbl td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--linha);} .cu-tbl th:first-child,.cu-tbl td:first-child{text-align:left;}
.cu-bar{height:10px;border-radius:5px;background:var(--dourado);}
</style>`;

async function carregarCustos(){
  const el=document.getElementById('tabCustos');
  el.innerHTML='<div class="loading-note">Carregando…</div>';
  const d=await apiPost('custoObter',{}).catch(()=>({ok:false}));
  if(!d.ok){el.innerHTML=`<div class="empty-note">${cuEsc(d.erro||'Não foi possível carregar. Atualize o Code.gs e gere uma nova implantação.')}</div>`;return;}
  cuDados=d; if(cuSub==='calc'&&cuSel.alvo) cuCarregarLinhas(); renderCustos();
}
function cuTrocarSub(k){cuSub=k;cuEditVar=null;if(k==='fixos'){cuFixosEd=cuDados.fixos.map(f=>({...f}));}renderCustos();}
function renderCustos(){
  const el=document.getElementById('tabCustos');
  const nav=[['calc','🧮 Calculadora'],['vars','📦 Variáveis'],['fixos','🏠 Fixos e taxas']].map(([k,l])=>`<button class="${cuSub===k?'on':''}" onclick="cuTrocarSub('${k}')">${l}</button>`).join('');
  el.innerHTML=CU_CSS+`<div class="cu-nav">${nav}</div><div id="cuCorpo"></div>`;
  if(cuSub==='calc') cuRenderCalc(); else if(cuSub==='vars') cuRenderVars(); else cuRenderFixos();
}
/* ---- Calculadora ---- */
function cuAlvoAtual(){const [t,...r]=String(cuSel.alvo).split(':');const id=r.join(':');return cuDados.alvos.find(a=>a.tipo===t&&a.id===id)||null;}
function cuCarregarLinhas(){
  const a=cuAlvoAtual(); if(!a){cuLinhas=[];return;}
  cuLinhas=cuDados.receitas.filter(r=>r.alvoTipo===a.tipo&&r.alvoId===a.id&&r.tamanho===cuSel.tam).map(r=>({variavelId:r.variavelId,quantidade:r.quantidade}));
}
function cuEscolherAlvo(v){cuSel.alvo=v;const a=cuAlvoAtual();cuSel.tam=a?a.tamanhos[0].key:'';cuCarregarLinhas();cuRenderCalc();}
function cuEscolherTam(v){cuSel.tam=v;cuCarregarLinhas();cuRenderCalc();}
function cuOptVars(sel){
  const g={};cuDados.variaveis.filter(v=>v.ativo||v.id===sel).forEach(v=>{(g[v.categoria]=g[v.categoria]||[]).push(v);});
  return '<option value="">— escolha a variável —</option>'+Object.keys(g).map(c=>`<optgroup label="${cuEsc(c)}">${g[c].map(v=>`<option value="${cuEsc(v.id)}" ${v.id===sel?'selected':''}>${cuEsc(v.nome)} (${cuEsc(v.unidade)})</option>`).join('')}</optgroup>`).join('');
}
function cuRenderCalc(){
  const d=cuDados,c=document.getElementById('cuCorpo');
  const gr={};d.alvos.forEach(a=>{(gr[a.grupo]=gr[a.grupo]||[]).push(a);});
  const optA='<option value="">— escolha o produto —</option>'+Object.keys(gr).map(g=>`<optgroup label="${cuEsc(g)}">${gr[g].map(a=>`<option value="${a.tipo}:${cuEsc(a.id)}" ${cuSel.alvo===a.tipo+':'+a.id?'selected':''}>${cuEsc(a.nome)}${a.ativo?'':' (inativo)'}</option>`).join('')}</optgroup>`).join('');
  const a=cuAlvoAtual();
  let corpo='';
  if(a){
    const tamSel=a.tamanhos.length>1?`<label class="cu-lb">Tamanho</label><select class="cu-in" onchange="cuEscolherTam(this.value)">${a.tamanhos.map(t=>`<option value="${cuEsc(t.key)}" ${t.key===cuSel.tam?'selected':''}>${cuEsc(t.label)}${t.preco?' — venda '+cuBRL(t.preco):''}</option>`).join('')}</select>`:'';
    corpo=`${tamSel}<label class="cu-lb">O que entra (na mesma unidade da variável)</label><div id="cuLinhas"></div>
      <button class="cu-btn sec" style="width:100%;margin-top:4px;" onclick="cuAddLinha()">+ Adicionar variável</button>
      <div class="cu-sum" id="cuTotais"></div>
      <button class="cu-btn" style="width:100%;margin-top:14px;" onclick="cuSalvarReceita(this)">Salvar custo deste produto</button>`;
  }
  c.innerHTML=`<div class="cu-card"><h3>Calculadora de custo</h3><p style="font-size:.78rem;opacity:.7;margin-bottom:8px;">Escolha o produto e some as variáveis usadas (ex.: 0,2 kg de muçarela). O custo é salvo na aba Produtos e alimenta o Financeiro.</p>
    <select class="cu-in" onchange="cuEscolherAlvo(this.value)">${optA}</select>${corpo}</div>`;
  if(a) cuRenderLinhas();
}
function cuRenderLinhas(){
  const box=document.getElementById('cuLinhas');
  box.innerHTML=cuLinhas.map((l,i)=>{
    const v=cuDados.variaveis.find(x=>x.id===l.variavelId);
    return `<div class="cu-row"><select class="cu-in" onchange="cuLinhas[${i}].variavelId=this.value;cuRenderLinhas()">${cuOptVars(l.variavelId)}</select>
      <input class="cu-in" type="number" step="any" min="0" inputmode="decimal" placeholder="${v?cuEsc(v.unidade):'qtd'}" value="${l.quantidade===''?'':l.quantidade}" oninput="cuLinhas[${i}].quantidade=cuN(this.value);cuAtualizarTotais()">
      <button class="cu-x" onclick="cuLinhas.splice(${i},1);cuRenderLinhas()">✕</button>
      <div class="cu-rowinfo" id="cuInfo${i}"></div></div>`;
  }).join('')||'<p style="font-size:.8rem;opacity:.55;margin:6px 0;">Nenhuma variável ainda.</p>';
  cuAtualizarTotais();
}
function cuAddLinha(){cuLinhas.push({variavelId:'',quantidade:''});cuRenderLinhas();}
function cuAtualizarTotais(){
  const d=cuDados;let total=0;
  cuLinhas.forEach((l,i)=>{
    const v=d.variaveis.find(x=>x.id===l.variavelId);const q=cuN(l.quantidade);const custo=v?q*v.custoEfetivo:0;total+=custo;
    const info=document.getElementById('cuInfo'+i);if(!info)return;
    if(!v){info.textContent='';return;}
    let eq='';if(v.unidade==='kg')eq=` = ${(q*1000).toLocaleString('pt-BR')} g ·`;if(v.unidade==='L')eq=` = ${(q*1000).toLocaleString('pt-BR')} ml ·`;
    info.textContent=`${eq} ${cuBRL(v.preco,4)}/${v.unidade}${v.desperdicio?' +'+v.desperdicio+'% desperdício':''} → ${cuBRL(custo,4)}`;
  });
  const a=cuAlvoAtual();const t=a?a.tamanhos.find(x=>x.key===cuSel.tam):null;const preco=t?t.preco:0;
  const lucro=preco-total,marg=preco>0?lucro/preco*100:0;const md=cuN(d.config.margemDesejadaPct);
  const sug=md<100?total/(1-md/100):0;
  const el=document.getElementById('cuTotais');if(!el)return;
  el.innerHTML=`<div><span>Custo total</span><b>${cuBRL(total)}</b></div><div><span>Preço de venda atual</span><b>${preco?cuBRL(preco):'—'}</b></div>
    <div><span>Lucro por unidade</span><b class="${lucro>=0?'cu-pos':'cu-neg'}">${preco?cuBRL(lucro):'—'}</b></div><div><span>Margem</span><b class="${marg>=md?'cu-pos':'cu-neg'}">${preco?marg.toFixed(1)+'%':'—'}</b></div>
    <div style="grid-column:1/-1"><span>Preço sugerido p/ margem de ${md}%</span><b>${total>0?cuBRL(sug):'—'}</b></div>`;
}
async function cuSalvarReceita(btn){
  const a=cuAlvoAtual();if(!a)return;
  const rest=setBtnLoading_(btn,'Salvando...');
  const d=await apiPost('custoSalvarReceita',{alvoTipo:a.tipo,alvoId:a.id,tamanho:cuSel.tam,linhas:cuLinhas.filter(l=>l.variavelId)}).catch(()=>({ok:false}));
  if(rest)rest();
  if(!d.ok){alert(d.erro||'Não foi possível salvar.');return;}
  cuDados=d;cuCarregarLinhas();cuRenderCalc();alert('Custo salvo!');
}
/* ---- Variáveis ---- */
function cuRenderVars(){
  const c=document.getElementById('cuCorpo');
  if(cuEditVar){cuRenderFormVar(c);return;}
  c.innerHTML=`<div class="cu-card"><div style="display:flex;gap:8px;"><input class="cu-in" placeholder="Buscar variável…" value="${cuEsc(cuBusca)}" oninput="cuBusca=this.value;cuRenderListaVars()"><button class="cu-btn" style="white-space:nowrap;" onclick="cuNovaVar()">+ Nova</button></div><div id="cuListaVars"></div></div>`;
  cuRenderListaVars();
}
function cuRenderListaVars(){
  const q=cuBusca.trim().toLowerCase(),g={};
  cuDados.variaveis.filter(v=>!q||v.nome.toLowerCase().includes(q)||v.categoria.toLowerCase().includes(q)).forEach(v=>{(g[v.categoria]=g[v.categoria]||[]).push(v);});
  document.getElementById('cuListaVars').innerHTML=Object.keys(g).map(cat=>`<div class="cu-cat">${cuEsc(cat)}</div>`+g[cat].map(v=>`<div class="cu-var" onclick="cuEditarVar('${cuEsc(v.id)}')" style="${v.ativo?'':'opacity:.45'}"><div><b>${cuEsc(v.nome)}</b><small>Estoque: ${v.estoque} ${cuEsc(v.unidade)} = ${cuBRL(v.valorEstoque)}${v.desperdicio?' · desperdício '+v.desperdicio+'%':''}</small></div><div style="text-align:right;font-family:var(--font-mono);">${v.preco?cuBRL(v.preco,4):'<span class="cu-neg">sem preço</span>'}<small>/ ${cuEsc(v.unidade)}</small></div></div>`).join('')).join('')||'<div class="empty-note">Nada encontrado.</div>';
}
function cuNovaVar(){cuEditVar={id:'',nome:'',categoria:'Ingrediente',unidade:'kg',preco:0,estoque:0,desperdicio:0,obs:'',ativo:true};cuRenderVars();}
function cuEditarVar(id){cuEditVar={...cuDados.variaveis.find(v=>v.id===id)};cuRenderVars();}
function cuRenderFormVar(c){
  const v=cuEditVar;
  const optC=[...new Set([...CU_CATS,v.categoria])].map(x=>`<option ${x===v.categoria?'selected':''}>${cuEsc(x)}</option>`).join('');
  const optU=[...new Set([...CU_UNIDADES,v.unidade])].map(x=>`<option ${x===v.unidade?'selected':''}>${cuEsc(x)}</option>`).join('');
  c.innerHTML=`<div class="cu-card"><h3>${v.id?'Editar':'Nova'} variável</h3>
    <label class="cu-lb">Nome</label><input class="cu-in" id="fvNome" value="${cuEsc(v.nome)}">
    <label class="cu-lb">Categoria</label><select class="cu-in" id="fvCat">${optC}</select>
    <label class="cu-lb">Unidade de medida (a da compra)</label><select class="cu-in" id="fvUn">${optU}</select>
    <label class="cu-lb">Valor por unidade (R$) — ex.: 13 por kg</label><input class="cu-in" id="fvPreco" type="number" step="any" inputmode="decimal" value="${v.preco}" oninput="cuFormCalc()">
    <label class="cu-lb">Quantidade em estoque (na mesma unidade)</label><input class="cu-in" id="fvEst" type="number" step="any" inputmode="decimal" value="${v.estoque}" oninput="cuFormCalc()">
    <label class="cu-lb">Desperdício / perda (%) — ex.: cebola 10</label><input class="cu-in" id="fvDesp" type="number" step="any" inputmode="decimal" value="${v.desperdicio}" oninput="cuFormCalc()">
    <label class="cu-lb">Observação</label><input class="cu-in" id="fvObs" value="${cuEsc(v.obs)}">
    <label class="cu-lb" style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="fvAtivo" ${v.ativo?'checked':''}> Ativa</label>
    <div class="cu-sum"><div><span>Valor em estoque</span><b id="fvValEst">—</b></div><div><span>Custo real por unidade</span><b id="fvEf">—</b></div></div>
    <div style="display:flex;gap:8px;margin-top:14px;"><button class="cu-btn" style="flex:1" onclick="cuSalvarVar(this)">Salvar</button><button class="cu-btn sec" onclick="cuEditVar=null;cuRenderVars()">Voltar</button>${v.id?'<button class="cu-btn red" onclick="cuExcluirVar()">Excluir</button>':''}</div></div>`;
  cuFormCalc();
}
function cuFormCalc(){
  const p=cuN(document.getElementById('fvPreco').value),e=cuN(document.getElementById('fvEst').value),d=Math.min(95,cuN(document.getElementById('fvDesp').value));
  document.getElementById('fvValEst').textContent=cuBRL(p*e);document.getElementById('fvEf').textContent=cuBRL(p/(1-d/100),4);
}
async function cuSalvarVar(btn){
  const v={...cuEditVar,nome:document.getElementById('fvNome').value.trim(),categoria:document.getElementById('fvCat').value,unidade:document.getElementById('fvUn').value,
    preco:cuN(document.getElementById('fvPreco').value),estoque:cuN(document.getElementById('fvEst').value),desperdicio:cuN(document.getElementById('fvDesp').value),
    obs:document.getElementById('fvObs').value,ativo:document.getElementById('fvAtivo').checked};
  const rest=setBtnLoading_(btn,'Salvando...');
  const d=await apiPost('custoSalvarVariavel',{variavel:v}).catch(()=>({ok:false}));
  if(rest)rest();
  if(!d.ok){alert(d.erro||'Não foi possível salvar.');return;}
  cuDados=d;cuEditVar=null;cuRenderVars();
}
async function cuExcluirVar(){
  if(!confirm('Excluir esta variável?'))return;
  const d=await apiPost('custoExcluirVariavel',{id:cuEditVar.id}).catch(()=>({ok:false}));
  if(!d.ok){alert(d.erro||'Não foi possível excluir.');return;}
  cuDados=d;cuEditVar=null;cuRenderVars();
}
/* ---- Fixos e taxas ---- */
function cuRenderFixos(){
  const c=document.getElementById('cuCorpo'),cf=cuDados.config;
  const campo=(k,l,dica)=>`<label class="cu-lb">${l}</label><input class="cu-in" type="number" step="any" inputmode="decimal" id="cp_${k}" value="${cf[k]}">${dica?`<div style="font-size:.7rem;opacity:.6;">${dica}</div>`:''}`;
  c.innerHTML=`<div class="cu-card"><h3>Custos fixos mensais</h3><p style="font-size:.78rem;opacity:.7;margin-bottom:8px;">Aluguel, internet, salários... São divididos pelos pedidos estimados do mês (rateio por pedido).</p>
    <div id="cuFixos"></div><button class="cu-btn sec" style="width:100%" onclick="cuFixosEd.push({id:'',nome:'',valor:0,ativo:true});cuDesenharFixos()">+ Adicionar custo fixo</button>
    <div class="cu-sum"><div><span>Total fixo / mês</span><b id="cuFixTot">—</b></div><div><span>Rateio por pedido</span><b id="cuFixRat">—</b></div></div></div>
    <div class="cu-card"><h3>Taxas e parâmetros</h3>
    ${campo('pedidosMesEstimado','Pedidos estimados por mês')}${campo('taxaPixPct','Taxa do Pix (%)')}${campo('taxaCartaoPct','Taxa do cartão (%)')}${campo('impostoPct','Imposto sobre vendas (%)')}
    ${campo('custoEntregaPorPedido','Custo de entrega por pedido (R$)','Gasolina + desgaste + motoboy, em média. Só entra em pedidos com frete.')}${campo('margemDesejadaPct','Margem de lucro desejada (%)','Usada no preço sugerido da calculadora.')}
    <button class="cu-btn" style="width:100%;margin-top:14px;" onclick="cuSalvarParams(this)">Salvar</button></div>`;
  cuDesenharFixos();
}
function cuDesenharFixos(){
  document.getElementById('cuFixos').innerHTML=cuFixosEd.map((f,i)=>`<div class="cu-row" style="grid-template-columns:1fr 100px 30px;"><input class="cu-in" placeholder="Nome" value="${cuEsc(f.nome)}" oninput="cuFixosEd[${i}].nome=this.value"><input class="cu-in" type="number" step="any" inputmode="decimal" placeholder="R$/mês" value="${f.valor||''}" oninput="cuFixosEd[${i}].valor=cuN(this.value);cuTotFixos()"><button class="cu-x" onclick="cuFixosEd.splice(${i},1);cuDesenharFixos()">✕</button></div>`).join('');
  cuTotFixos();
}
function cuTotFixos(){
  const t=cuFixosEd.filter(f=>f.ativo!==false).reduce((s,f)=>s+cuN(f.valor),0);
  const p=Math.max(1,cuN(document.getElementById('cp_pedidosMesEstimado')?.value||cuDados.config.pedidosMesEstimado));
  document.getElementById('cuFixTot').textContent=cuBRL(t);document.getElementById('cuFixRat').textContent=cuBRL(t/p);
}
async function cuSalvarParams(btn){
  const campos={};['pedidosMesEstimado','taxaPixPct','taxaCartaoPct','impostoPct','custoEntregaPorPedido','margemDesejadaPct'].forEach(k=>campos[k]=cuN(document.getElementById('cp_'+k).value));
  const rest=setBtnLoading_(btn,'Salvando...');
  const d=await apiPost('custoSalvarParametros',{fixos:cuFixosEd,campos}).catch(()=>({ok:false}));
  if(rest)rest();
  if(!d.ok){alert(d.erro||'Não foi possível salvar.');return;}
  cuDados=d;cuFixosEd=d.fixos.map(f=>({...f}));cuRenderFixos();alert('Salvo!');
}

/* ---------- FINANCEIRO (dashboard) ---------- */
let finF={preset:'30d',de:'',ate:'',agrupar:'dia'}, finDados=null;
function finISO(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function finPeriodo(){
  const h=new Date(),f=finF;let de=new Date(h),ate=new Date(h);
  if(f.preset==='hoje'){}
  else if(f.preset==='7d')de.setDate(h.getDate()-6);
  else if(f.preset==='30d')de.setDate(h.getDate()-29);
  else if(f.preset==='mes')de=new Date(h.getFullYear(),h.getMonth(),1);
  else if(f.preset==='custom'&&f.de&&f.ate)return {de:f.de,ate:f.ate};
  return {de:finISO(de),ate:finISO(ate)};
}
async function carregarFinanceiro(gravar){
  const el=document.getElementById('tabFinanceiro');
  if(!finDados) el.innerHTML='<div class="loading-note">Carregando…</div>';
  const {de,ate}=finPeriodo();
  const d=await apiPost('custoDashboard',{de,ate,agrupar:finF.agrupar,gravar:!!gravar}).catch(()=>({ok:false}));
  if(!d.ok){el.innerHTML=`<div class="empty-note">${cuEsc(d.erro||'Não foi possível carregar. Atualize o Code.gs e gere uma nova implantação.')}</div>`;return;}
  finDados=d;renderFinanceiro();
  if(gravar)alert('Planilha atualizada! Veja as abas Margem_Pedidos e Margem_Resumo.');
}
function finSet(k,v){finF[k]=v;if(k==='preset'&&v!=='custom'){finDados=null;}carregarFinanceiro();}
function finChart(serie){
  if(!serie.length)return '<div class="empty-note">Sem pedidos no período.</div>';
  const n=serie.length,bw=10,gap=6,gw=bw*3+gap+6,W=Math.max(320,n*gw+40),H=200,top=10,bot=34;
  const maxV=Math.max(1,...serie.map(s=>Math.max(s.receita,s.custo,s.lucro))),minV=Math.min(0,...serie.map(s=>s.lucro));
  const y=v=>top+(H-top-bot)*(1-(v-minV)/(maxV-minV));
  const step=n>16?Math.ceil(n/12):1;
  let g=`<line x1="30" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#211A0F" stroke-opacity=".3"/>`;
  serie.forEach((s,i)=>{
    const x=34+i*gw;
    [[s.receita,'#F9B31A'],[s.custo,'#D31A1B'],[s.lucro,'#2E8B45']].forEach(([v,c],j)=>{
      const y0=y(0),y1=y(v);g+=`<rect x="${x+j*bw}" y="${Math.min(y0,y1)}" width="${bw-1}" height="${Math.max(1,Math.abs(y0-y1))}" fill="${c}" rx="2"/>`;
    });
    if(i%step===0)g+=`<text x="${x+bw*1.5}" y="${H-16}" font-size="9" text-anchor="middle" fill="#211A0F">${cuEsc(s.label)}</text>`;
  });
  g+=`<text x="2" y="${y(maxV)+8}" font-size="9" fill="#211A0F">${Math.round(maxV)}</text>`;
  return `<div style="overflow-x:auto;"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg></div>
    <div style="font-size:.72rem;display:flex;gap:12px;margin-top:4px;"><span><i style="background:#F9B31A;display:inline-block;width:10px;height:10px;border-radius:2px"></i> Faturamento</span><span><i style="background:#D31A1B;display:inline-block;width:10px;height:10px;border-radius:2px"></i> Custo</span><span><i style="background:#2E8B45;display:inline-block;width:10px;height:10px;border-radius:2px"></i> Lucro</span></div>`;
}
function renderFinanceiro(){
  const d=finDados,t=d.totais,el=document.getElementById('tabFinanceiro'),f=finF;
  const pre=[['hoje','Hoje'],['7d','7 dias'],['30d','30 dias'],['mes','Este mês'],['custom','Período']].map(([k,l])=>`<button class="${f.preset===k?'on':''}" onclick="finSet('preset','${k}')">${l}</button>`).join('');
  const agr=[['dia','Por dia'],['semana','Por semana'],['mes','Por mês']].map(([k,l])=>`<button class="${f.agrupar===k?'on':''}" onclick="finSet('agrupar','${k}')">${l}</button>`).join('');
  const custom=f.preset==='custom'?`<div style="display:flex;gap:8px;margin-bottom:10px;max-width:420px;"><input class="cu-in" type="date" value="${f.de||d.de}" onchange="finF.de=this.value;finSet('preset','custom')"><input class="cu-in" type="date" value="${f.ate||d.ate}" onchange="finF.ate=this.value;finSet('preset','custom')"></div>`:'';
  const comp=d.composicao,totC=Object.values(comp).reduce((a,b)=>a+b,0)||1;
  const nomes={produtos:'Ingredientes e embalagens',entrega:'Entrega',taxas:'Taxas de pagamento',imposto:'Impostos',fixos:'Custos fixos (rateio)'};
  const compHtml=Object.keys(comp).map(k=>`<div style="margin-bottom:8px;font-size:.8rem;"><div style="display:flex;justify-content:space-between;"><span>${nomes[k]}</span><b>${cuBRL(comp[k])} · ${(comp[k]/totC*100).toFixed(0)}%</b></div><div class="cu-bar" style="width:${Math.max(2,comp[k]/totC*100)}%"></div></div>`).join('');
  const topHtml=d.top.map(p=>`<tr><td>${cuEsc(p.nome)}</td><td>${p.qtd}</td><td>${cuBRL(p.receita)}</td><td>${cuBRL(p.custo)}</td><td class="${p.lucro>=0?'cu-pos':'cu-neg'}">${cuBRL(p.lucro)}</td></tr>`).join('');
  const alerta=t.semCusto?`<div class="cu-card" style="background:var(--dourado-pale);font-size:.82rem;">⚠️ ${t.semCusto} pedido(s) têm item sem custo cadastrado — o lucro deles está superestimado. Cadastre em <b>Custos → Calculadora</b>.</div>`:'';
  el.innerHTML=CU_CSS+`<div class="cu-filtros">${pre}</div>${custom}<div class="cu-filtros">${agr}</div>${alerta}
    <div class="cu-kpis"><div class="cu-kpi"><span>Faturamento</span><b>${cuBRL(t.receita)}</b></div><div class="cu-kpi"><span>Custo total</span><b>${cuBRL(t.custo)}</b></div>
    <div class="cu-kpi"><span>Lucro</span><b class="${t.lucro>=0?'cu-pos':'cu-neg'}">${cuBRL(t.lucro)}</b></div><div class="cu-kpi"><span>Margem</span><b class="${t.margemPct>=0?'cu-pos':'cu-neg'}">${t.margemPct.toFixed(1)}%</b></div>
    <div class="cu-kpi"><span>Pedidos</span><b>${t.pedidos}</b></div><div class="cu-kpi"><span>Ticket médio</span><b>${cuBRL(t.ticket)}</b></div></div>
    <div class="cu-card"><h3>Evolução</h3>${finChart(d.serie)}</div>
    <div class="cu-card"><h3>Para onde vai o custo</h3>${compHtml}</div>
    <div class="cu-card"><h3>Produtos mais vendidos</h3><div style="overflow-x:auto;"><table class="cu-tbl"><tr><th>Item</th><th>Qtd</th><th>Receita</th><th>Custo</th><th>Lucro</th></tr>${topHtml||'<tr><td colspan="5">Sem dados</td></tr>'}</table></div></div>
    <button class="cu-btn sec" style="max-width:760px;width:100%;" onclick="carregarFinanceiro(true)">📄 Gravar balanço na planilha</button>
    <p style="font-size:.7rem;opacity:.55;margin-top:8px;max-width:760px;">Conta só pedidos aceitos em diante. Lucro = total pago − ingredientes − entrega − taxas − impostos − rateio dos custos fixos.</p>`;
}

/* ---------- início ---------- */
(function iniciar(){
  configurarBotaoOutraPessoa_();
  let salva = '';
  try{ salva = localStorage.getItem(LS_KEY) || ''; }catch(e){}
  if(salva){
    document.getElementById('inSenhaPainel').value = salva;
    senhaPainel = salva;
    apiPost('listarPedidos', { apenasHoje:false }).then(data=>{
      if(data.ok){ habilitarAudio(); abrirPainel(); }
      else { senhaPainel = ''; }
    }).catch(()=>{ senhaPainel = ''; });
  }
})();
</script>
