<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel — Douratta Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 22;font-size:20px;line-height:1;vertical-align:middle;display:inline-block;}
.btn-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:7px;animation:girarSpinner .6s linear infinite;}
.btn-spinner.dark{border-color:rgba(33,26,15,0.25);border-top-color:var(--carvao);}
@keyframes girarSpinner{to{transform:rotate(360deg);}}
:root{
  --dourado:#F9B31A; --dourado-dark:#C6870A; --dourado-pale:#FDECC4;
  --vermelho:#D31A1B; --vermelho-dark:#9E1212;
  --avorio:#FFFBF2; --avorio-dark:#F1E7D2;
  --carvao:#211A0F; --carvao-soft:#3A2E18;
  --bianco:#FFFFFF; --linha:rgba(33,26,15,0.10);
  --verde:#2E8B45; --verde-pale:#E4F3E8;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--avorio-dark);color:var(--carvao);min-height:100vh;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;border:none;background:none;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- login ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--bianco);border-radius:22px;padding:28px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(33,26,15,0.12);}
.login-card h1{font-family:var(--font-display);font-size:1.4rem;margin-bottom:4px;}
.login-card p{font-size:0.82rem;opacity:.65;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:0.78rem;font-weight:600;margin-bottom:5px;}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--linha);border-radius:12px;font-size:0.95rem;background:var(--avorio);}
.field input:focus{outline:none;border-color:var(--dourado);}
.btn-primary{width:100%;background:var(--vermelho);color:#fff;padding:13px;border-radius:12px;font-weight:700;font-size:0.92rem;}
.err-msg{color:var(--vermelho);font-size:0.8rem;margin-top:8px;min-height:1em;}

/* ---------- shell do painel ---------- */
#panelScreen{display:none;min-height:100vh;}
.topbar{background:var(--carvao);color:var(--avorio);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar h1{font-family:var(--font-display);font-size:1.15rem;font-weight:600;}
.topbar .status{font-size:0.72rem;opacity:.6;}
.topbar .sair{font-size:0.78rem;opacity:.7;text-decoration:underline;}
.tabs{display:flex;background:var(--bianco);border-bottom:1px solid var(--linha);overflow-x:auto;position:sticky;top:53px;z-index:49;}
.tab-btn{flex:1;min-width:110px;padding:13px 10px;font-weight:700;font-size:0.8rem;color:var(--carvao-soft);opacity:.55;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;}
.tab-btn.active{opacity:1;color:var(--vermelho);border-bottom-color:var(--vermelho);}
.tab-btn .count{background:var(--vermelho);color:#fff;border-radius:99px;font-size:0.68rem;padding:1px 6px;min-width:16px;}
.tab-btn svg{width:15px;height:15px;flex-shrink:0;}
.content{max-width:1100px;margin:0 auto;padding:18px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ---------- cards de pedido ---------- */
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:760px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.grid{grid-template-columns:1fr 1fr 1fr;}}

.order-card{background:var(--bianco);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(33,26,15,0.07);border-left:5px solid var(--dourado);}
.order-card.status-aceito{border-left-color:var(--verde);}
.order-card .oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.order-card .oc-nome{font-family:var(--font-display);font-weight:600;font-size:1.05rem;}
.order-card .oc-hora{font-size:0.72rem;opacity:.55;white-space:nowrap;}
.oc-tag{display:inline-block;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--dourado-pale);color:var(--dourado-dark);margin-bottom:8px;}
.oc-tag.aceito{background:var(--verde-pale);color:var(--verde);}
.oc-line{font-size:0.82rem;margin-bottom:3px;display:flex;gap:6px;}
.oc-line b{font-weight:700;}
.oc-line svg{width:13px;height:13px;flex-shrink:0;margin-top:2px;opacity:.6;}
.oc-itens{margin:10px 0;padding:10px 12px;background:var(--avorio);border-radius:12px;font-size:0.8rem;max-height:170px;overflow-y:auto;}
.oc-item-row{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--linha);}
.oc-item-row:last-child{margin-bottom:0;border-bottom:none;padding-bottom:0;}
.oc-item-nome{font-weight:700;margin-bottom:2px;}
.oc-item-detail{opacity:.75;font-size:0.75rem;}
.oc-total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--linha);}
.oc-total .valor{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--vermelho);}
.oc-actions{display:flex;gap:8px;margin-top:12px;}
.btn-aceitar{flex:1;background:var(--verde);color:#fff;padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-wpp{flex:1;background:var(--dourado);color:var(--carvao);padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-wpp svg,.btn-aceitar svg{width:16px;height:16px;}

/* ---------- checklist ---------- */
.check-card{background:var(--bianco);border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(33,26,15,0.07);}
.check-card h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:2px;}
.check-card .sub{font-size:0.75rem;opacity:.6;margin-bottom:12px;}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--linha);}
.check-item:last-of-type{border-bottom:none;}
.check-item.sub{padding-left:18px;}
.check-item input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--verde);flex-shrink:0;}
.check-item.done label{text-decoration:line-through;opacity:.45;}
.check-item label{font-size:0.85rem;line-height:1.4;}
.check-item .detail{display:block;font-size:0.76rem;opacity:.7;margin-top:1px;}
.check-title{font-weight:800;font-size:0.9rem;margin-top:12px;padding-bottom:4px;border-bottom:2px solid var(--carvao);}
.check-title:first-of-type{margin-top:2px;}
.tag-sem,.tag-com{display:inline-block;font-size:0.65rem;font-weight:800;border-radius:5px;padding:1px 6px;margin-right:6px;vertical-align:1px;}
.tag-sem{background:#FBE3E3;color:var(--vermelho-dark);}
.tag-com{background:var(--verde-pale);color:var(--verde);}
.btn-concluir{width:100%;margin-top:12px;background:var(--carvao);color:var(--avorio);padding:11px;border-radius:11px;font-weight:700;font-size:0.85rem;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-concluir[disabled]{background:var(--avorio-dark);color:var(--carvao-soft);opacity:.6;cursor:not-allowed;}
.btn-concluir .material-symbols-outlined{font-size:18px;}
.check-waiting{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px 10px;opacity:.6;font-size:0.82rem;}
.check-waiting .material-symbols-outlined{font-size:32px;}
.check-progress{text-align:right;font-size:0.72rem;font-weight:700;opacity:.55;margin-top:6px;}

/* ---------- pontuação ---------- */
table{width:100%;border-collapse:collapse;background:var(--bianco);border-radius:14px;overflow:hidden;}
table th,table td{padding:11px 14px;text-align:left;font-size:0.85rem;border-bottom:1px solid var(--linha);}
table th{background:var(--carvao);color:var(--avorio);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.03em;}
table td.mono{font-family:var(--font-mono);}
.pontos-num{font-weight:700;color:var(--dourado-dark);}

/* ---------- cardápio ---------- */
.cat-block{margin-bottom:22px;}
.cat-block h3{font-family:var(--font-display);font-size:1.05rem;margin-bottom:10px;}
.prod-edit-row{background:var(--bianco);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px;}
.prod-edit-row .nome{font-weight:700;font-size:0.88rem;flex:1;min-width:140px;}
.prod-edit-row .mini-field{display:flex;flex-direction:column;gap:3px;}
.prod-edit-row .mini-field label{font-size:0.65rem;opacity:.6;font-weight:700;}
.prod-edit-row .mini-field input{width:78px;padding:7px 8px;border:1.5px solid var(--linha);border-radius:8px;font-size:0.82rem;}
.toggle-ativo{display:flex;align-items:center;gap:6px;font-size:0.72rem;font-weight:700;}
.btn-salvar-prod{background:var(--dourado);color:var(--carvao);padding:8px 14px;border-radius:9px;font-weight:700;font-size:0.75rem;}

.empty-note{text-align:center;padding:40px 10px;opacity:.5;font-size:0.88rem;}
.loading-note{text-align:center;padding:30px;opacity:.5;font-size:0.88rem;}

/* ---------- impressão térmica automática do pedido ---------- */
.btn-imprimir{flex:0 0 auto;width:44px;background:var(--carvao);color:var(--avorio);border-radius:11px;display:flex;align-items:center;justify-content:center;}
#areaImpressaoPedido{display:none;}
@media print{
  body *{visibility:hidden;}
  #areaImpressaoPedido, #areaImpressaoPedido *{visibility:visible;}
  #areaImpressaoPedido{display:block;position:absolute;top:0;left:0;width:100%;}
  @page{margin:0;size:80mm auto;}
}
.recibo{font-family:var(--font-mono);font-size:11.5px;color:#000;line-height:1.45;width:76mm;padding:2mm;}
.recibo .r-center{text-align:center;}
.recibo .r-logo{font-weight:800;font-size:15px;letter-spacing:0.5px;}
.recibo .r-sub{font-size:11px;margin-bottom:2px;}
.recibo .r-linha{border-top:1px dashed #000;margin:6px 0;}
.recibo .r-linha-dupla{border-top:2px solid #000;margin:4px 0 8px;}
.recibo .r-row{display:flex;justify-content:space-between;gap:8px;margin-bottom:2px;}
.recibo .r-total{font-weight:800;font-size:13.5px;border-top:1px solid #000;padding-top:4px;margin-top:3px;}
.recibo .r-bloco{margin:4px 0;}
.recibo .r-titulo{font-weight:800;margin-bottom:4px;}
.recibo .r-item{margin-bottom:7px;}
.recibo .r-item-titulo{font-weight:800;}
.recibo .r-item-linha{margin-left:2px;}
.recibo .r-item-sub{margin-left:12px;}
.recibo .r-destaque{font-weight:800;}
.recibo .r-rodape{font-size:9px;margin-top:6px;word-break:break-all;}
.recibo #qrPedidoImpressao{display:flex;justify-content:center;margin-top:6px;}
</style>
</head>
<body>

<div id="areaImpressaoPedido"></div>

<div id="loginScreen">
  <div class="login-card">
    <h1>Painel Douratta</h1>
    <p>Acesso restrito da pizzaria.</p>
    <div class="field"><label>Senha do painel</label><input id="inSenhaPainel" type="password" placeholder="••••••" autofocus></div>
    <div class="err-msg" id="loginErr"></div>
    <button class="btn-primary" id="btnEntrarPainel" onclick="entrarPainel()">Entrar</button>
  </div>
</div>

<div id="panelScreen">
  <div class="topbar">
    <h1>Painel Douratta</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span class="status" id="statusConexao">atualizando...</span>
      <a href="#" class="sair" onclick="sairPainel();return false;">Sair</a>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="pedidos" onclick="mudarAba('pedidos')">
      <span class="material-symbols-outlined">receipt_long</span>
      Pedidos <span class="count" id="countNovos" style="display:none;">0</span>
    </button>
    <button class="tab-btn" data-tab="checklist" onclick="mudarAba('checklist')">
      <span class="material-symbols-outlined">checklist</span>
      Checklist
    </button>
    <button class="tab-btn" data-tab="pontuacao" onclick="mudarAba('pontuacao')">
      <span class="material-symbols-outlined">loyalty</span>
      Pontuação
    </button>
    <button class="tab-btn" data-tab="cardapio" onclick="mudarAba('cardapio')">
      <span class="material-symbols-outlined">restaurant_menu</span>
      Cardápio
    </button>
  </div>
  <div class="content">
    <div class="tab-panel active" id="tabPedidos"><div class="loading-note">Carregando pedidos…</div></div>
    <div class="tab-panel" id="tabChecklist"><div class="loading-note">Carregando checklist…</div></div>
    <div class="tab-panel" id="tabPontuacao"><div class="loading-note">Carregando pontuação…</div></div>
    <div class="tab-panel" id="tabCardapio"><div class="loading-note">Carregando cardápio…</div></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO — mesma URL do cardápio e da página de pontos.
   ========================================================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbz8qL33hAbb17yvAN8OvbSYN4xaH6NVdtLwZ65g_0IWz3pMyGI6p2wyRNDnb-cWVZec/exec';
const LS_KEY = 'douratta_painel_senha_v1';
const POLL_MS = 15000; // intervalo de checagem de novos pedidos

let senhaPainel = '';
let abaAtual = 'pedidos';
let pedidosCache = [];
let idsConhecidos = new Set();
let audioCtx = null;
let checklistState = {}; // { [pedidoId]: { [indice]: true } } — persistido no localStorage

/* ---------- som de notificação (Web Audio, sem arquivo externo) ---------- */
function habilitarAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function tocarSom(){
  if(!audioCtx) return;
  try{
    [0,0.18,0.36].forEach((delay,i)=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = 'sine';
      o.frequency.value = i===2 ? 880 : 660;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime+delay);
      g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+delay+0.28);
      o.start(audioCtx.currentTime+delay);
      o.stop(audioCtx.currentTime+delay+0.3);
    });
  }catch(e){}
}

/* ---------- helpers ---------- */
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatHora(d){ const dt = new Date(d); return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }

/* =========================================================
   IMPRESSÃO TÉRMICA AUTOMÁTICA DO PEDIDO
   Ao aceitar um pedido (ou pelo botão "Reimprimir"), monta um cupom
   formatado pra impressora térmica (80mm) com TODAS as informações do
   pedido — itens detalhados (sabor por sabor, sem/com ingrediente,
   borda, observação), valores (subtotal, frete, desconto, moedas,
   total), forma de pagamento e troco, e QR Code de acompanhamento no
   rodapé — e chama a impressão do navegador.

   IMPORTANTE sobre "automático": o navegador, por segurança, sempre
   abre a caixa de diálogo de impressão do sistema operacional — não é
   possível mandar direto pra impressora térmica sem esse passo usando
   só HTML/JS puro. Pra ficar 100% sem clique nenhum (impressão
   silenciosa), o Chrome precisa ser aberto com a flag de "impressão
   kiosk" (--kiosk-printing) nesse computador, ou usar uma ponte como o
   QZ Tray. Com a impressora térmica configurada como IMPRESSORA
   PADRÃO do Windows/Mac, o diálogo já abre com ela pré-selecionada —
   aí ao clicar em "Aceitar pedido" já mostra o preview e é só
   confirmar (Enter já funciona na maioria dos casos).
   ========================================================= */
// Chave pra ligar/desligar o QR Code + o link de acompanhamento no
// rodapé da nota impressa. Deixe "false" pra não aparecer nada disso
// na impressão (mesmo que o link/QR ainda exista ou seja gerado na
// planilha) — é só voltar pra "true" quando quiser mostrar de novo.
const IMPRIMIR_QR_ACOMPANHAMENTO = false;
function itemImpressaoHtml_(it){
  if(it.tipo==='pizza'){
    let h = `<div class="r-item"><div class="r-item-titulo">${it.qty}x Pizza ${it.tamanho||''}</div>`;
    (it.sabores||[]).forEach(s=>{
      h += `<div class="r-item-linha">• Sabor: ${s.nome}</div>`;
      (s.removidos||[]).forEach(r=>h+=`<div class="r-item-sub">SEM ${r}</div>`);
      (s.adicionados||[]).forEach(a=>h+=`<div class="r-item-sub">+ ${a} (extra)</div>`);
    });
    if(it.borda) h += `<div class="r-item-linha">Borda: ${it.borda}</div>`;
    if(it.obs) h += `<div class="r-item-linha">Obs.: ${it.obs}</div>`;
    if(it.resgatado) h += `<div class="r-item-linha r-destaque">** RESGATADO COM MOEDAS **</div>`;
    return h + `</div>`;
  }
  if(it.tipo==='bebida'){
    return `<div class="r-item"><div class="r-item-titulo">${it.qty}x ${it.nome}</div></div>`;
  }
  // simples
  let h = `<div class="r-item"><div class="r-item-titulo">${it.qty}x ${it.nome}</div>`;
  (it.removidos||[]).forEach(r=>h+=`<div class="r-item-sub">SEM ${r}</div>`);
  (it.adicionados||[]).forEach(a=>h+=`<div class="r-item-sub">+ ${a} (extra)</div>`);
  if(it.borda) h += `<div class="r-item-linha">Borda: ${it.borda}</div>`;
  if(it.obs) h += `<div class="r-item-linha">Obs.: ${it.obs}</div>`;
  if(it.resgatado) h += `<div class="r-item-linha r-destaque">** RESGATADO COM MOEDAS **</div>`;
  return h + `</div>`;
}
function reciboHtmlPedido_(p){
  const dt = new Date(p.dataHora);
  const dataStr = dt.toLocaleDateString('pt-BR');
  const horaStr = dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const totalNum = Number(p.total)||0;
  const trocoParaNum = Number(p.trocoPara)||0;
  const ehDinheiro = /dinheiro/i.test(p.formaPagamento||'');
  const troco = (ehDinheiro && trocoParaNum>0) ? Math.max(0, trocoParaNum-totalNum) : null;
  const itensHtml = (p.itens||[]).map(itemImpressaoHtml_).join('');
  return `<div class="recibo">
    <div class="r-center r-logo">DOURATTA PIZZARIA</div>
    <div class="r-center r-sub">Pedido ${p.id}</div>
    <div class="r-linha-dupla"></div>
    <div class="r-row"><span>Data/hora</span><span>${dataStr} ${horaStr}</span></div>
    <div class="r-row"><span>Cliente</span><span>${p.nome||''}</span></div>
    <div class="r-row"><span>Telefone</span><span>${p.telefone||''}</span></div>
    <div class="r-bloco"><b>Endereço:</b><br>${p.endereco||''}</div>
    <div class="r-linha"></div>
    <div class="r-titulo">ITENS DO PEDIDO</div>
    ${itensHtml}
    <div class="r-linha"></div>
    <div class="r-row"><span>Subtotal</span><span>${formatBRL(p.subtotal)}</span></div>
    <div class="r-row"><span>Frete</span><span>${formatBRL(p.frete)}</span></div>
    ${Number(p.desconto)?`<div class="r-row"><span>Desconto</span><span>-${formatBRL(p.desconto)}</span></div>`:''}
    ${Number(p.moedasUsadas)?`<div class="r-row"><span>Moedas usadas</span><span>${p.moedasUsadas}</span></div>`:''}
    <div class="r-row r-total"><span>TOTAL</span><span>${formatBRL(p.total)}</span></div>
    <div class="r-linha"></div>
    <div class="r-row"><span>Pagamento</span><span>${p.formaPagamento||''}</span></div>
    ${trocoParaNum?`<div class="r-row"><span>Troco para</span><span>${formatBRL(trocoParaNum)}</span></div>`:''}
    ${troco!==null?`<div class="r-row r-destaque"><span>Troco</span><span>${formatBRL(troco)}</span></div>`:''}
    ${p.codigoIndicacao?`<div class="r-row"><span>Indicação</span><span>${p.codigoIndicacao}</span></div>`:''}
    <div class="r-linha"></div>
    ${IMPRIMIR_QR_ACOMPANHAMENTO ? `<div id="qrPedidoImpressao"></div>
    <div class="r-center r-rodape">Acompanhe seu pedido em:<br>${p.qrLink || ('https://www.douratta.com.br/pedidos/'+p.id)}</div>` : ''}
  </div>`;
}
function imprimirPedido(p){
  if(!p){ alert('Não encontrei os dados desse pedido pra imprimir.'); return; }
  const area = document.getElementById('areaImpressaoPedido');
  area.innerHTML = reciboHtmlPedido_(p);
  if(IMPRIMIR_QR_ACOMPANHAMENTO){
    const qrLink = p.qrLink || ('https://www.douratta.com.br/pedidos/' + p.id);
    const qrEl = document.getElementById('qrPedidoImpressao');
    if(qrEl && window.QRCode){
      try{
        new QRCode(qrEl, { text: qrLink, width: 130, height: 130, correctLevel: QRCode.CorrectLevel.M });
      }catch(e){}
    }
  }
  // pequeno atraso pra garantir que o QR Code (canvas) já foi desenhado
  // antes do navegador tirar o "retrato" da página pra impressão
  setTimeout(()=>{ window.print(); }, 300);
}
function reimprimirPedido(id){
  imprimirPedido(pedidosCache.find(pd=>pd.id===id));
}
// Mostra um loader dentro do próprio botão clicado (spinner + texto),
// e desabilita ele, pra pessoa nunca achar que o clique não funcionou
// enquanto espera a resposta do servidor. Se a ação der certo, o card
// costuma ser re-renderizado (o botão nem existe mais); se der erro,
// chama a função devolvida pra restaurar o botão do jeito que estava.
function setBtnLoading_(btn, textoCarregando){
  if(!btn) return null;
  const originalHtml = btn.innerHTML;
  const originalDisabled = btn.disabled;
  btn.disabled = true;
  const escuro = getComputedStyle(btn).color === 'rgb(33, 26, 15)' || btn.classList.contains('btn-salvar-prod');
  btn.innerHTML = `<span class="btn-spinner${escuro?' dark':''}"></span>${textoCarregando||'Enviando...'}`;
  return function(){ btn.disabled = originalDisabled; btn.innerHTML = originalHtml; };
}
async function apiPost(acao, dados){
  const resp = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({acao, senhaPainel}, dados))
  });
  return resp.json();
}

/* ---------- login ---------- */
async function entrarPainel(){
  const val = document.getElementById('inSenhaPainel').value.trim();
  const errEl = document.getElementById('loginErr');
  if(!val){ errEl.textContent = 'Digite a senha.'; return; }
  senhaPainel = val;
  const restaurar = setBtnLoading_(document.getElementById('btnEntrarPainel'), 'Entrando...');
  const data = await apiPost('listarPedidos', { apenasHoje:false }).catch(()=>({ok:false,erro:'Sem conexão agora.'}));
  if(!data.ok){ if(restaurar) restaurar(); errEl.textContent = data.erro || 'Senha incorreta.'; senhaPainel=''; return; }
  try{ localStorage.setItem(LS_KEY, val); }catch(e){}
  habilitarAudio();
  abrirPainel();
}
function sairPainel(){
  senhaPainel = '';
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  document.getElementById('panelScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}
function abrirPainel(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('panelScreen').style.display = 'block';
  carregarChecklistState_();
  atualizarTudo();
  setInterval(atualizarTudo, POLL_MS);
}

/* ---------- abas ---------- */
function mudarAba(nome){
  abaAtual = nome;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===nome));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab'+nome.charAt(0).toUpperCase()+nome.slice(1)).classList.add('active');
  if(nome==='pontuacao') carregarPontuacao();
  if(nome==='cardapio') carregarCardapio();
  if(nome==='checklist') renderChecklist();
}

/* ---------- ciclo de atualização (pedidos) ---------- */
async function atualizarTudo(){
  const data = await apiPost('listarPedidos', { apenasHoje:false }).catch(()=>null);
  const statusEl = document.getElementById('statusConexao');
  if(!data || !data.ok){ statusEl.textContent = 'sem conexão'; return; }
  statusEl.textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  const novosIds = data.pedidos.filter(p=>p.status==='novo').map(p=>p.id);
  const apareceuNovo = novosIds.some(id=>!idsConhecidos.has(id));
  if(apareceuNovo && idsConhecidos.size>0){ tocarSom(); }
  idsConhecidos = new Set(data.pedidos.map(p=>p.id));

  pedidosCache = data.pedidos;
  renderPedidos();
  const countEl = document.getElementById('countNovos');
  const qtdNovos = data.pedidos.filter(p=>p.status==='novo').length;
  countEl.textContent = qtdNovos;
  countEl.style.display = qtdNovos>0 ? 'inline-block' : 'none';
  if(abaAtual==='checklist') renderChecklist();
}

/* ---------- ABA PEDIDOS ---------- */
function itemResumoHtml(it){
  if(it.tipo==='pizza'){
    const sab = (it.sabores||[]).map(s=>s.nome).join(' + ');
    const extras = (it.sabores||[]).map(s=>{
      const partes = [];
      if(s.removidos&&s.removidos.length) partes.push('sem '+s.removidos.join(', '));
      if(s.adicionados&&s.adicionados.length) partes.push('+ '+s.adicionados.join(', '));
      return partes.length ? `${s.nome}: ${partes.join(' · ')}` : '';
    }).filter(Boolean).join(' | ');
    return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.tamanho||''} — ${sab||it.nome}</div>
      ${it.borda?`<div class="oc-item-detail">Borda: ${it.borda}</div>`:''}
      ${extras?`<div class="oc-item-detail">${extras}</div>`:''}
      ${it.obs?`<div class="oc-item-detail">Obs.: ${it.obs}</div>`:''}
      ${it.resgatado?`<div class="oc-item-detail" style="color:var(--dourado-dark);font-weight:700;">Resgatado com moedas</div>`:''}</div>`;
  }
  if(it.tipo==='bebida'){
    return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.nome}</div></div>`;
  }
  const partes = [];
  if(it.removidos&&it.removidos.length) partes.push('sem '+it.removidos.join(', '));
  if(it.adicionados&&it.adicionados.length) partes.push('+ '+it.adicionados.join(', '));
  return `<div class="oc-item-row"><div class="oc-item-nome">${it.qty}x ${it.nome}</div>
    ${it.borda?`<div class="oc-item-detail">Borda: ${it.borda}</div>`:''}
    ${partes.length?`<div class="oc-item-detail">${partes.join(' · ')}</div>`:''}
    ${it.obs?`<div class="oc-item-detail">Obs.: ${it.obs}</div>`:''}
    ${it.resgatado?`<div class="oc-item-detail" style="color:var(--dourado-dark);font-weight:700;">Resgatado com moedas</div>`:''}</div>`;
}

function renderPedidos(){
  const ativos = pedidosCache.filter(p=>p.status==='novo' || p.status==='aceito');
  const el = document.getElementById('tabPedidos');
  if(!ativos.length){ el.innerHTML = '<div class="empty-note">Nenhum pedido em aberto no momento.</div>'; return; }
  el.innerHTML = `<div class="grid">${ativos.map(p=>{
    const telStr = String(p.telefone||'');
    return `
    <div class="order-card status-${p.status}">
      <div class="oc-head">
        <div class="oc-nome">${p.nome}</div>
        <div class="oc-hora">${formatHora(p.dataHora)}</div>
      </div>
      <span class="oc-tag ${p.status==='aceito'?'aceito':''}">${p.status==='novo'?'Novo pedido':'Aceito'}</span>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">call</span> ${telStr}</div>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">location_on</span> ${p.endereco}</div>
      <div class="oc-line"><span class="material-symbols-outlined" style="font-size:15px;opacity:.6;">payments</span> ${p.formaPagamento}${p.trocoPara?' · troco pra '+p.trocoPara:''}</div>
      <div class="oc-itens">${(p.itens||[]).map(itemResumoHtml).join('')}</div>
      ${p.codigoIndicacao?`<div class="oc-line">Indicação: <b>${p.codigoIndicacao}</b></div>`:''}
      ${p.moedasUsadas?`<div class="oc-line">${p.moedasUsadas} moedas usadas como desconto</div>`:''}
      <div class="oc-total"><span>Total</span><span class="valor">${formatBRL(p.total)}</span></div>
      <div class="oc-actions">
        ${p.status==='novo' ? `<button class="btn-aceitar" onclick="aceitarPedido('${p.id}', this)">
          <span class="material-symbols-outlined">check_circle</span>
          Aceitar pedido</button>` : `<button class="btn-aceitar" onclick="mudarAba('checklist')" style="background:var(--carvao);">
          <span class="material-symbols-outlined">visibility</span>
          Acompanhar preparo</button>`}
        <a class="btn-wpp" href="https://wa.me/${telStr.replace(/\D/g,'')}" target="_blank">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 2.7 17.2L2 22l4.9-1.3A11 11 0 1 0 20.5 3.5zm-8.5 17a9 9 0 0 1-4.6-1.3l-.3-.2-3.1.8.8-3-.2-.3A9 9 0 1 1 12 20.5z"/></svg>
          WhatsApp</a>
        <button class="btn-imprimir" onclick="reimprimirPedido('${p.id}')" title="Imprimir pedido">
          <span class="material-symbols-outlined" style="font-size:19px;">print</span>
        </button>
      </div>
    </div>
  `;
  }).join('')}</div>`;
}

async function aceitarPedido(id, btn){
  const restaurar = setBtnLoading_(btn, 'Aceitando...');
  // guarda os dados completos do pedido ANTES de atualizar a lista,
  // pra ter o que imprimir mesmo que a atualização demore/falhe
  const pedidoOriginal = pedidosCache.find(pd=>pd.id===id);
  const data = await apiPost('aceitarPedido', { id }).catch(()=>({ok:false}));
  if(!data.ok){ if(restaurar) restaurar(); alert(data.erro || 'Não foi possível aceitar agora.'); return; }
  const pedidoParaImprimir = pedidoOriginal
    ? Object.assign({}, pedidoOriginal, { status:'aceito', aceitoEm: new Date().toISOString() })
    : null;
  await atualizarTudo();
  imprimirPedido(pedidoParaImprimir || pedidosCache.find(pd=>pd.id===id));
  mudarAba('checklist');
}

/* ---------- ABA CHECKLIST ---------- */
function carregarChecklistState_(){
  try{ checklistState = JSON.parse(localStorage.getItem('douratta_checklist_state_v1')||'{}'); }catch(e){ checklistState = {}; }
}
function salvarChecklistState_(){
  try{ localStorage.setItem('douratta_checklist_state_v1', JSON.stringify(checklistState)); }catch(e){}
}
function marcarChecklistItem(pedidoId, idx, checked){
  checklistState[pedidoId] = checklistState[pedidoId] || {};
  checklistState[pedidoId][idx] = checked;
  salvarChecklistState_();
  renderChecklist(); // re-renderiza pra também atualizar se o botão "Finalizar checklist" já pode habilitar
}
// Monta o checklist em linhas GRANULARES: cada sabor, cada ingrediente
// removido e cada adicional viram uma linha própria com checkbox — não
// é só "2x Pizza Grande", é sabor por sabor, sem-isso, com-aquilo, pra
// quem está montando não perder nada. Linhas com titulo:true são só
// cabeçalho (sem checkbox, não contam pro total de itens a marcar).
function checklistLinhasDoPedido(p){
  const linhas = [];
  (p.itens||[]).forEach(it=>{
    if(it.tipo==='pizza'){
      linhas.push({ titulo:true, texto:`${it.qty}x Pizza ${it.tamanho||''}` });
      (it.sabores||[]).forEach(s=>{
        linhas.push({ texto:`Sabor: ${s.nome}` });
        (s.removidos||[]).forEach(r=>linhas.push({ texto:`Sem ${r}`, tag:'sem', sub:true }));
        (s.adicionados||[]).forEach(a=>linhas.push({ texto:`Com ${a} extra`, tag:'com', sub:true }));
      });
      if(it.borda) linhas.push({ texto:`Borda: ${it.borda}` });
      if(it.obs) linhas.push({ texto:`Obs.: ${it.obs}`, tag:'obs' });
    } else if(it.tipo==='simples'){
      linhas.push({ titulo:true, texto:`${it.qty}x ${it.nome}` });
      (it.removidos||[]).forEach(r=>linhas.push({ texto:`Sem ${r}`, tag:'sem', sub:true }));
      (it.adicionados||[]).forEach(a=>linhas.push({ texto:`Com ${a} extra`, tag:'com', sub:true }));
      if(it.borda) linhas.push({ texto:`Borda: ${it.borda}` });
      if(it.obs) linhas.push({ texto:`Obs.: ${it.obs}`, tag:'obs' });
    } else {
      linhas.push({ titulo:true, texto:`${it.qty}x ${it.nome} (bebida)` });
    }
  });
  return linhas;
}
// Cada etapa sabe: qual o rótulo, qual ação chamar pra passar pra
// PRÓXIMA etapa, o texto do botão e o ícone (Material Symbols).
const STATUS_INFO_ = {
  aceito:     { label:'Aceito',          proximaAcao:'iniciarPreparo',    botao:'Iniciar preparo',       icone:'outdoor_grill' },
  em_preparo: { label:'Preparando',      proximaAcao:'confirmarChecklist',botao:'Finalizar checklist',   icone:'task_alt' },
  finalizado: { label:'Finalizado',      proximaAcao:'saiuParaEntrega',   botao:'Saiu para entrega',     icone:'local_shipping' },
  em_rota:    { label:'Saiu p/ entrega', proximaAcao:'marcarEntregue',    botao:'Marcar como entregue',  icone:'done_all' },
  entregue:   { label:'Entregue',        proximaAcao:null,                botao:'',                      icone:'done_all' }
};
function renderChecklist(){
  const hojeStr = new Date().toDateString();
  const doDia = pedidosCache.filter(p=>p.status!=='novo' && new Date(p.dataHora).toDateString()===hojeStr);
  const el = document.getElementById('tabChecklist');
  if(!doDia.length){ el.innerHTML = '<div class="empty-note">Nenhum pedido aceito hoje ainda.</div>'; return; }
  el.innerHTML = `<div class="grid">${doDia.map(p=>{
    const info = STATUS_INFO_[p.status] || STATUS_INFO_.aceito;
    const estado = checklistState[p.id] || {};

    // O checklist granular (com os checkboxes) só é mostrado durante o
    // preparo (em_preparo). Antes disso ainda não tem o que marcar;
    // depois disso já foi conferido, não precisa mostrar de novo.
    let corpoHtml = '';
    let podeAvancar = true;
    if(p.status === 'em_preparo'){
      const linhas = checklistLinhasDoPedido(p);
      const checkaveis = linhas.filter(l=>!l.titulo);
      const marcados = checkaveis.filter((l,i)=>estado[linhas.indexOf(l)]).length;
      podeAvancar = checkaveis.length===0 || marcados === checkaveis.length;
      corpoHtml = linhas.map((l,idx)=>{
        if(l.titulo) return `<div class="check-title">${l.texto}</div>`;
        const tagHtml = l.tag==='sem' ? `<span class="tag-sem">SEM</span>` : l.tag==='com' ? `<span class="tag-com">+</span>` : '';
        return `<div class="check-item ${l.sub?'sub':''} ${estado[idx]?'done':''}" id="ck-${p.id}-${idx}">
          <input type="checkbox" id="ckbox-${p.id}-${idx}" ${estado[idx]?'checked':''} onchange="marcarChecklistItem('${p.id}',${idx},this.checked)">
          <label for="ckbox-${p.id}-${idx}">${tagHtml}${l.texto}</label>
        </div>`;
      }).join('');
      if(checkaveis.length){
        corpoHtml += `<div class="check-progress">${marcados}/${checkaveis.length} conferidos</div>`;
      }
    } else if(p.status === 'aceito'){
      corpoHtml = `<div class="check-waiting"><span class="material-symbols-outlined">outdoor_grill</span>Toque em "Iniciar preparo" pra ver o checklist de ingredientes.</div>`;
    }

    const botaoHtml = info.proximaAcao
      ? `<button class="btn-concluir" ${!podeAvancar?'disabled title="Marque todos os itens do checklist primeiro"':''} onclick="avancarStatus('${p.id}','${info.proximaAcao}', this)">
          <span class="material-symbols-outlined">${info.icone}</span>${info.botao}
        </button>`
      : `<div class="sub" style="margin-top:10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;"><span class="material-symbols-outlined" style="font-size:16px;color:var(--verde);">done_all</span>Pedido entregue</div>`;

    return `<div class="check-card">
      <h3>${p.nome} <span style="font-weight:400;font-size:0.75rem;opacity:.65;">· ${info.label}</span></h3>
      <div class="sub">Pedido às ${formatHora(p.dataHora)} · Total ${formatBRL(p.total)}</div>
      ${corpoHtml}
      ${botaoHtml}
    </div>`;
  }).join('')}</div>`;
}
async function avancarStatus(id, acao, btn){
  const restaurar = setBtnLoading_(btn, 'Atualizando...');
  const data = await apiPost(acao, { id }).catch(()=>({ok:false}));
  if(!data.ok){ if(restaurar) restaurar(); alert(data.erro||'Não foi possível atualizar agora.'); return; }
  await atualizarTudo();
}

/* ---------- ABA PONTUAÇÃO ---------- */
async function carregarPontuacao(){
  const el = document.getElementById('tabPontuacao');
  el.innerHTML = '<div class="loading-note">Carregando…</div>';
  const data = await apiPost('listarPontuacao', {}).catch(()=>({ok:false}));
  if(!data.ok){ el.innerHTML = `<div class="empty-note">${data.erro||'Não foi possível carregar.'}</div>`; return; }
  if(!data.clientes.length){ el.innerHTML = '<div class="empty-note">Nenhum cliente cadastrado no programa de pontos ainda.</div>'; return; }
  el.innerHTML = `<table><thead><tr><th>Nome</th><th>Telefone</th><th>Código</th><th>Indicado por</th><th>Moedas</th></tr></thead><tbody>
    ${data.clientes.map(c=>`<tr><td>${c.nome}</td><td class="mono">${c.telefone}</td><td class="mono">${c.codigoUnico}</td><td class="mono">${c.indicadoPor||'—'}</td><td class="pontos-num">${c.pontos}</td></tr>`).join('')}
  </tbody></table>`;
}

/* ---------- ABA CARDÁPIO ---------- */
let cardapioCache = { MENU:{}, CATS:[] };
async function carregarCardapio(){
  const el = document.getElementById('tabCardapio');
  el.innerHTML = '<div class="loading-note">Carregando…</div>';
  const data = await apiPost('listarProdutosAdmin', {}).catch(()=>({ok:false}));
  if(!data.ok){ el.innerHTML = `<div class="empty-note">${data.erro||'Não foi possível carregar o cardápio agora.'}</div>`; return; }
  cardapioCache.MENU = data.MENU || {};
  cardapioCache.CATS = data.CATS || [];
  renderCardapioEdit();
}
function renderCardapioEdit(){
  const el = document.getElementById('tabCardapio');
  el.innerHTML = `<p style="font-size:0.8rem;opacity:.65;margin-bottom:16px;">Ajuste rápido de preços e disponibilidade. Pra criar produto novo, trocar fotos ou ingredientes, edite direto na planilha.</p>` +
    cardapioCache.CATS.map(cat=>{
      const itens = cardapioCache.MENU[cat.id] || [];
      if(!itens.length) return '';
      const tipoPizza = cat.tipo === 'pizza';
      return `<div class="cat-block"><h3>${cat.label||cat.id}</h3>
        ${itens.map(p=>`
          <div class="prod-edit-row" id="prow-${p.id}">
            <div class="nome">${p.name}</div>
            ${tipoPizza ? `
              <div class="mini-field"><label>Broto</label><input type="number" step="0.5" id="pf-${p.id}-broto" value="${p.sizes?.broto ?? ''}"></div>
              <div class="mini-field"><label>Média</label><input type="number" step="0.5" id="pf-${p.id}-media" value="${p.sizes?.media ?? ''}"></div>
              <div class="mini-field"><label>Grande</label><input type="number" step="0.5" id="pf-${p.id}-grande" value="${p.sizes?.grande ?? ''}"></div>
              <div class="mini-field"><label>Família</label><input type="number" step="0.5" id="pf-${p.id}-familia" value="${p.sizes?.familia ?? ''}"></div>
            ` : `
              <div class="mini-field"><label>Preço</label><input type="number" step="0.5" id="pf-${p.id}-unico" value="${p.price ?? ''}"></div>
            `}
            <label class="toggle-ativo"><input type="checkbox" id="pf-${p.id}-ativo" ${p.ativo===false?'':'checked'}> Ativo</label>
            <button class="btn-salvar-prod" onclick="salvarProduto('${p.id}', ${tipoPizza}, this)">Salvar</button>
          </div>
        `).join('')}
      </div>`;
    }).join('');
}
async function salvarProduto(id, tipoPizza, btn){
  const restaurar = setBtnLoading_(btn, 'Salvando...');
  const campos = { ativo: document.getElementById(`pf-${id}-ativo`).checked };
  if(tipoPizza){
    campos.preco_broto = document.getElementById(`pf-${id}-broto`).value;
    campos.preco_media = document.getElementById(`pf-${id}-media`).value;
    campos.preco_grande = document.getElementById(`pf-${id}-grande`).value;
    campos.preco_familia = document.getElementById(`pf-${id}-familia`).value;
  } else {
    campos.preco_unico = document.getElementById(`pf-${id}-unico`).value;
  }
  const data = await apiPost('atualizarProduto', { id, campos }).catch(()=>({ok:false}));
  if(restaurar) restaurar();
  const row = document.getElementById(`prow-${id}`);
  if(data.ok){
    row.style.background = 'var(--verde-pale)';
    setTimeout(()=>{ row.style.background=''; }, 900);
  } else {
    alert(data.erro || 'Não foi possível salvar agora.');
  }
}

/* ---------- início ---------- */
(function iniciar(){
  let salva = '';
  try{ salva = localStorage.getItem(LS_KEY) || ''; }catch(e){}
  if(salva){
    document.getElementById('inSenhaPainel').value = salva;
    senhaPainel = salva;
    apiPost('listarPedidos', { apenasHoje:false }).then(data=>{
      if(data.ok){ habilitarAudio(); abrirPainel(); }
      else { senhaPainel = ''; }
    }).catch(()=>{ senhaPainel = ''; });
  }
})();
</script>
